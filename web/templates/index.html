  <script src="/static/admin.js"></script>
  <script src="/static/playback.js"></script>
  <script>
    const { createApp, ref, computed, watch, onMounted } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // ── scroll position preservation ─────────────────────────
    const _scrollMap = new Map();
    window.addEventListener('scroll', () => {
      _scrollMap.set(window.location.href, window.scrollY);
    }, { passive: true });
    function restoreScroll() {
      const y = _scrollMap.get(window.location.href);
      if (y != null) Vue.nextTick(() => window.scrollTo({ top: y, behavior: 'instant' }));
    }

    // ── helpers ──────────────────────────────────────────────
    async function apiFetch(url, options) {
      const r = await fetch(url, options);
      if (!r.ok) return null;
      return r.json();
    }
    function imgErr(e) { e.target.style.display = 'none'; }
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes >= 1e9) return (bytes / 1e9).toFixed(1) + ' GB';
      return (bytes / 1e6).toFixed(0) + ' MB';
    }
    async function copyText(text, doneRef) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      if (doneRef) {
        doneRef.value = true;
        setTimeout(() => { doneRef.value = false; }, 2000);
      }
    }

    function baseVideoCode(code) {
      return (code || '').replace(/-(?:UC|U|C)$/i, '');
    }

    // ── SortBar ───────────────────────────────────────────────
    const SortBar = {
      name: 'SortBar',
      template: '#tpl-sort-bar',
      props: { sort: { type: String, default: 'date' }, playback: Boolean },
      emits: ['change'],
    };

    // ── VideoCard ─────────────────────────────────────────────
    const VideoCard = {
      name: 'VideoCard',
      template: '#tpl-video-card',
      props: { video: Object },
      setup: () => ({ baseVideoCode, imgErr })
    };

    // ── Pagination ────────────────────────────────────────────
    const Pagination = {
      name: 'Pagination',
      template: '#tpl-pagination',
      props: { page: Number, total: Number, limit: Number },
      emits: ['change'],
      setup(props) {
        const totalPages = computed(() => Math.ceil(props.total / props.limit));
        const pages = computed(() => {
          const tp = totalPages.value, cur = props.page, arr = [];
          for (let i = 1; i <= tp; i++) {
            if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) arr.push(i);
            else if (arr[arr.length - 1] !== '...') arr.push('...');
          }
          return arr;
        });
        return { totalPages, pages };
      }
    };

    const FILTER_TAGS = ['无码流出', 'JAV 无码破解', 'LADA 无码破解', 'LTX 无码破解', '原装无码', '中文字幕'];

    function queryTags(query) {
      const raw = query.tag;
      if (!raw) return [];
      return Array.isArray(raw) ? raw : [raw];
    }

    const SubtitleReviewView = {
      template: '#tpl-subtitle-review',
      setup() {
        const items = ref([]);
        const loading = ref(true);
        const error = ref('');
        const saving = ref(new Set());
        onMounted(async () => {
          try {
            const response = await fetch('/api/videos/subtitle-review');
            if (!response.ok) throw new Error('加载失败');
            items.value = await response.json();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        });
        async function classify(item, classification) {
          if (saving.value.has(item.code)) return;
          saving.value.add(item.code);
          error.value = '';
          try {
            await postJson('/api/videos/' + encodeURIComponent(item.code) + '/subtitle-classification', { classification });
            items.value = items.value.filter(candidate => candidate.code !== item.code);
          } catch (e) {
            error.value = e.message;
          } finally {
            saving.value.delete(item.code);
          }
        }
        return { items, loading, error, saving, classify, baseVideoCode };
      }
    };

    const ScrapeProgressView = {
      template: '#tpl-scrape-progress',
      setup() {
        const items = ref([]);
        const loading = ref(true);
        const error = ref('');
        let fetching = false;
        let disposed = false;

        async function load() {
          if (fetching) return;
          fetching = true;
          try {
            const response = await fetch('/api/scrape-progress', { cache: 'no-store' });
            if (!response.ok) throw new Error('无法读取刮削进度');
            const data = await response.json();
            if (!disposed) {
              items.value = data;
              error.value = '';
            }
          } catch (e) {
            if (!disposed) error.value = e.message;
          } finally {
            fetching = false;
            if (!disposed) loading.value = false;
          }
        }

        const sourceLabels = {pipeline_auto: '自动上传', pipeline_rescrape: '重新刮削', video: '后台刮削'};
        const statusLabels = {
          PREPARING: '正在入库', PENDING: '已排队', WAITING: '等待后台处理', RUNNING: '处理中',
          DONE: '已完成', FAILED: '失败', CANCELLED: '已取消', SKIPPED: '已跳过'
        };
        function statusTone(status) {
          if (status === 'DONE') return 'bg-green-100 text-green-800';
          if (status === 'FAILED') return 'bg-red-100 text-red-800';
          if (['RUNNING', 'PREPARING'].includes(status)) return 'bg-indigo-100 text-indigo-800';
          if (status === 'WAITING') return 'bg-yellow-100 text-yellow-900';
          return 'bg-gray-100 text-gray-700';
        }
        const isActive = item => ['PREPARING', 'PENDING', 'WAITING', 'RUNNING'].includes(item.status);
        const stages = item => item.kind === 'video'
          ? ['scrape', 'assets']
          : ['scrape', 'assets', 'translate', 'short_title', 'rename'];
        const progress = item => item.status === 'DONE' || item.phase === 'complete'
          ? stages(item).length : Math.max(0, stages(item).indexOf(item.phase));
        const phaseLabel = phase => ({
          scrape: '刮削影片信息', assets: '处理封面及系列信息', translate: '翻译标题',
          short_title: '生成短标题', rename: '重命名影片', complete: '收尾中'
        })[phase] || phase;
        const formatTime = time => new Date(time * 1000).toLocaleString('zh-CN');
        let timer;
        onMounted(() => {
          load();
          timer = setInterval(() => { if (!document.hidden) load(); }, 5000);
        });
        Vue.onUnmounted(() => {
          disposed = true;
          clearInterval(timer);
        });
        return { items, loading, error, load, baseVideoCode, sourceLabels, statusLabels, statusTone,
          isActive, stages, progress, phaseLabel, formatTime };
      }
    };

    async function replacementPreview(code, files, subtitleZh, uncensored) {
      return postJson('/api/videos/' + encodeURIComponent(code) + '/replace-preview', {
        files, subtitle_zh: subtitleZh, uncensored
      });
    }

    // Returns a function that, fed cumulative uploaded bytes, yields a smoothed
    // speed string (MB/s · KB/s), throttled to ~2 Hz. null between updates.
    function makeUploadSpeed() {
      let lastLoaded = 0, lastTime = Date.now();
      const samples = [];
      return (loaded) => {
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        if (dt < 0.5) return null;
        const bps = (loaded - lastLoaded) / dt;
        samples.push(bps);
        if (samples.length > 5) samples.shift();
        const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
        lastLoaded = loaded;
        lastTime = now;
        return avg >= 1e6 ? (avg / 1e6).toFixed(1) + ' MB/s' : Math.max(0, avg / 1e3).toFixed(0) + ' KB/s';
      };
    }

    function genUploadId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    // Upload an array of File objects one at a time as raw streamed requests
    // (each < the 50GB cap, written straight to the target volume — no /tmp).
    // onProgress receives cumulative bytes across all parts. Returns the
    // upload_id that groups them; pass it to add-auto / add-manual.
    async function streamUploadParts(files, volumePath, onProgress) {
      const uploadId = genUploadId();
      let priorBytes = 0;
      for (const f of files) {
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/videos/upload-part');
          xhr.setRequestHeader('X-Upload-Id', uploadId);
          xhr.setRequestHeader('X-Volume-Path', encodeURIComponent(volumePath));
          xhr.setRequestHeader('X-Dest-Name', encodeURIComponent(f.name));
          xhr.setRequestHeader('X-File-Size', String(f.size));
          xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable && onProgress) onProgress(priorBytes + e.loaded);
          });
          xhr.addEventListener('load', () => {
            let d; try { d = JSON.parse(xhr.responseText); } catch { d = {}; }
            if (xhr.status === 200) resolve(d);
            else reject(new Error(d.error || `上传失败: ${f.name}`));
          });
          xhr.addEventListener('error', () => reject(new Error(`网络错误，上传失败: ${f.name}`)));
          xhr.send(f);
        });
        priorBytes += f.size;
      }
      return uploadId;
    }

    // POST JSON; parses the response safely and surfaces the real error
    // instead of choking on an HTML error page ("Unexpected token '<'").
    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      let data; try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // ── BatchModal ────────────────────────────────────────────
    const BatchModal = {
      template: '#tpl-batch-modal',
      emits: ['close'],
      setup(props, { emit }) {
        const batchTitle = ref(null);
        const opener = document.activeElement;
        const batchStep       = ref('batch-select');
        const batchFiles      = ref([]);
        const batchChecking   = ref(false);
        const batchCheckError = ref('');
        const batchGroups     = ref([]);
        const batchVolume     = ref('');
        const mediaLibraries  = ref([]);
        const batchProcessing = ref(false);
        const batchResults    = ref([]);

        const batchStepNum = computed(() =>
          ({ 'batch-select': 1, 'batch-review': 2, 'batch-progress': 3 }[batchStep.value] || 1)
        );
        const hasNewGroups  = computed(() => batchGroups.value.some(g => !g.exists && !g.warning));
        const hasWarnings   = computed(() => batchGroups.value.some(g => g.warning));
        const canStartUpload = computed(() =>
          !hasWarnings.value && batchGroups.value.length > 0 &&
          (!hasNewGroups.value || batchVolume.value)
        );

        onMounted(async () => {
          batchTitle.value.focus();
          const libs = await apiFetch('/api/config/media-libraries');
          if (libs) mediaLibraries.value = libs;
        });
        watch(batchStep, () => batchTitle.value.focus(), { flush: 'post' });
        Vue.onUnmounted(() => { if (opener?.isConnected) opener.focus(); });

        function keepBatchFocus(event) {
          const controls = [...event.currentTarget.querySelectorAll('button:enabled, input:enabled:not([type=file]), a[href]')];
          const index = controls.indexOf(document.activeElement);
          if (index < 0 || index === (event.shiftKey ? 0 : controls.length - 1)) {
            event.preventDefault();
            (event.shiftKey ? controls.at(-1) : controls[0])?.focus();
          }
        }

        function onBatchFilesChange(e) {
          const newFiles = Array.from(e.target.files || []);
          const existingNames = new Set(batchFiles.value.map(f => f.name));
          batchFiles.value = [...batchFiles.value, ...newFiles.filter(f => !existingNames.has(f.name))];
          e.target.value = '';
        }

        async function runBatchCheck() {
          batchChecking.value = true;
          batchCheckError.value = '';
          try {
            const resp = await fetch('/api/videos/batch-check', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filenames: batchFiles.value.map(f => f.name) }),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || '检测失败');
            batchGroups.value = buildGroups(data);
            batchStep.value = 'batch-review';
          } catch (e) {
            batchCheckError.value = e.message;
          } finally {
            batchChecking.value = false;
          }
        }

        function buildGroups(items) {
          const map = {};
          for (const item of items) {
            const key = item.code || ('__err__' + item.filename);
            if (!map[key]) {
              map[key] = {
                code: item.code,
                db_code: item.db_code || null,
                files: [],
                exists: item.exists,
                original_path: item.original_path,
                db_parts: item.db_parts || [],
                subtitle_zh: /(?:-UC|-C)$/i.test(item.code || ''),
                subtitle_classification: /(?:-UC|-C)$/i.test(item.code || '') ? '中文字幕' : '',
                uncensored_leaked: /(?:-UC|-U)$/i.test(item.code || ''),
                uncensored_crack_tag: /(?:-UC|-U)$/i.test(item.code || '') ? 'LTX 无码破解' : '',
                uncensored_native: false,
                warning: item.error || null, previewRequest: 0, finalNames: [], previewError: '',
              };
            }
            map[key].files.push(item);
            // mixed new+replace in same code → warn
            if (map[key].exists !== null && item.exists !== null && map[key].exists !== item.exists) {
              map[key].warning = '同一番号下新增与替换混合，请检查文件';
            }
          }
          // ambiguous part: replace row but can't tell which part to replace
          for (const g of Object.values(map)) {
            if (!g.warning && g.exists && g.db_parts.length > 1) {
              const allHavePart = g.files.every(f => f.part);
              if (!allHavePart) {
                g.warning = '无法确定 Part，请在文件名中加上 -partN（如 SSIS-456-part1.mp4）';
              }
            }
          }
          return Object.values(map);
        }

        watch(() => batchGroups.value.map(group => [group, group.subtitle_classification,
          group.uncensored_crack_tag, group.uncensored_native]), (groups, previous) => {
          const earlier = new Map(previous.map(([group, ...options]) => [group, options]));
          for (const [group, subtitles, crack, native] of groups) {
            if (!group.exists || group.warning) continue;
            const old = earlier.get(group);
            if (old && old[0] === subtitles && old[1] === crack && old[2] === native) continue;
            const request = ++group.previewRequest;
            group.previewError = '';
            group.finalNames = [];
            replacementPreview(group.db_code || group.code, group.files.map(file => ({
              filename: file.filename, part: file.part || null
            })), Boolean(subtitles), Boolean(crack) || native)
              .then(data => { if (request === group.previewRequest) group.finalNames = data.names; })
              .catch(error => {
                if (request !== group.previewRequest) return;
                group.finalNames = [];
                group.previewError = error.message;
              });
          }
        });

        async function startBatchProcess() {
          batchStep.value = 'batch-progress';
          batchProcessing.value = true;
          batchResults.value = batchGroups.value.map(g => ({
            code: g.code,
            type: g.exists ? 'replace' : 'new',
            status: 'pending',
            message: '',
            progress: 0,
            speed: '',
            viewCode: null,
          }));

          for (let i = 0; i < batchGroups.value.length; i++) {
            const group = batchGroups.value[i];
            const result = batchResults.value[i];
            result.status = 'running';
            try {
              if (!group.exists) {
                await processNewGroup(group, result);
              } else {
                await processReplaceGroup(group, result);
              }
              result.status = 'done';
            } catch (e) {
              result.status = 'error';
              result.message = e.message;
            }
          }
          batchProcessing.value = false;
        }

        async function processNewGroup(group, result) {
          // Phase 1: stream each part to the target volume, with progress.
          const files = group.files
            .map(fi => batchFiles.value.find(bf => bf.name === fi.filename))
            .filter(Boolean);
          const totalBytes = files.reduce((sum, f) => sum + f.size, 0) || 1;
          const speed = makeUploadSpeed();
          const uploadId = await streamUploadParts(files, batchVolume.value, loaded => {
            result.progress = Math.round(loaded / totalBytes * 100);
            const s = speed(loaded);
            if (s) result.speed = s;
          });
          await postJson('/api/videos/add-auto', {
            upload_id: uploadId,
            volume_path: batchVolume.value,
            uncensored_crack_tag: group.uncensored_crack_tag,
            subtitle_classification: group.subtitle_classification,
          });
          result.message = '已加入刮削队列';
        }

        // POST a raw file body with progress; resolves with parsed JSON, rejects on error.
        function _xhrUpload(url, headers, file, onProgress) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
            xhr.upload.addEventListener('progress', e => {
              if (e.lengthComputable) onProgress(e.loaded);
            });
            xhr.addEventListener('load', () => {
              let data; try { data = JSON.parse(xhr.responseText); } catch { data = {}; }
              if (xhr.status === 200) resolve(data);
              else reject(new Error(data.error || '替换失败'));
            });
            xhr.addEventListener('error', () => reject(new Error('网络错误，上传失败')));
            xhr.send(file);
          });
        }

        async function processReplaceGroup(group, result) {
          const requestCode = group.db_code || group.code;
          let finalCode = requestCode;
          const totalBytes = group.files.reduce((sum, fi) => {
            const f = batchFiles.value.find(bf => bf.name === fi.filename);
            return sum + (f ? f.size : 0);
          }, 0) || 1;
          let loadedBefore = 0;
          const speed = makeUploadSpeed();

          // For each file in the group (usually one, unless replacing multiple parts)
          for (const fi of group.files) {
            const f = batchFiles.value.find(bf => bf.name === fi.filename);
            if (!f) throw new Error(`文件未找到: ${fi.filename}`);

            const originalPart = fi.part;
            const qp = originalPart ? `?part=${encodeURIComponent(originalPart)}` : '';
            // Replace must target the actual DB code (variant may differ from the
            // uploaded file's suffix, e.g. DB has ABW-123-U but file is ABW-123-C).
            const url = `/api/videos/${encodeURIComponent(requestCode)}/replace${qp}`;

            const headers = {
              'X-Dest-Name': encodeURIComponent(f.name),
              'X-File-Size': String(f.size),
              'X-Subtitle-Zh': group.subtitle_classification ? '1' : '0',
              'X-Subtitle-Classification': encodeURIComponent(group.subtitle_classification || ''),
              'X-Uncensored-Leaked': group.uncensored_crack_tag ? '1' : '0',
              'X-Uncensored-Crack-Tag': encodeURIComponent(group.uncensored_crack_tag || ''),
              'X-Uncensored-Native': group.uncensored_native ? '1' : '0',
            };
            if (originalPart) headers['X-Part'] = originalPart;

            result.message = group.files.length > 1 ? `上传中… (${fi.filename})` : '上传中…';
            const replaceResponse = await _xhrUpload(url, headers, f, loaded => {
              result.progress = Math.round((loadedBefore + loaded) / totalBytes * 100);
              const s = speed(loadedBefore + loaded);
              if (s) result.speed = s;
            });
            finalCode = replaceResponse.new_code || replaceResponse.code || finalCode;
            loadedBefore += f.size;
          }
          result.progress = 100;
          result.viewCode = finalCode;
          result.code = finalCode;
          result.message = '替换完成';
        }

        return {
          batchTitle, keepBatchFocus, batchStep, batchFiles, batchChecking, batchCheckError,
          batchGroups, batchVolume, mediaLibraries,
          batchProcessing, batchResults,
          batchStepNum, hasNewGroups, hasWarnings, canStartUpload,
          onBatchFilesChange, runBatchCheck, buildGroups,
          startBatchProcess, processNewGroup, processReplaceGroup,
        };
      }
    };

    // ── AddVideoModal ─────────────────────────────────────────
    const AddVideoModal = {
      template: '#tpl-add-video',
      props: { initialStep: { type: String, default: 'file-select' } },
      emits: ['close'],
      setup(props, { emit }) {
        const router = VueRouter.useRouter();

        // ── Shared state ────────────────────────────────────────
        const addStep    = ref(props.initialStep);
        const addFiles   = ref([]);
        const addVolume  = ref('');
        const addMode    = ref('auto');
        const addSubtitleClassification = ref('');
        const addDoneCode = ref('');
        const addError   = ref('');

        const mediaLibraries = ref([]);
        const addFileInput = ref(null);

        // ── Auto mode state ─────────────────────────────────────
        const autoFinished = ref(false);

        // Shared upload progress (single auto/manual add).
        const addUploading  = ref(false);
        const addUploadPct  = ref(0);
        const addUploadSpeed = ref('');

        // ── Manual mode state ────────────────────────────────────
        const manualCodeType    = ref('WEST');
        const manualCodeNumber  = ref(1);
        const manualMaxNumber   = ref(0);
        const manualIsMultipart = ref(false);
        const manualUploading   = ref(false);
        const manualCode        = ref('');
        const manualTitleJp     = ref('');
        const manualTitleZh     = ref('');
        const manualTitleShort  = ref('');
        const manualActors      = ref('');
        const manualTags        = ref([]);
        const manualSaving      = ref(false);
        const manualMetaError   = ref('');

        const addFileSorted = computed(() =>
          [...addFiles.value].sort((a, b) => a.name.localeCompare(b.name))
        );

        // ── Lifecycle ────────────────────────────────────────────
        onMounted(async () => {
          const libs = await apiFetch('/api/config/media-libraries');
          if (libs) mediaLibraries.value = libs;
          if (props.initialStep === 'manual-code') await fetchMaxCode();
        });

        // ── Handlers ─────────────────────────────────────────────
        function onAddFilesChange(e) {
          addFiles.value = Array.from(e.target.files || []);
          addSubtitleClassification.value = addFiles.value.some(f => /-(?:UC|C)(?:\.|$)/i.test(f.name))
            ? '中文字幕' : '';
          if (addFiles.value.length > 1) manualIsMultipart.value = true;
        }

        async function fetchMaxCode() {
          const data = await apiFetch(`/api/videos/max-code/${manualCodeType.value}`);
          if (data) {
            manualMaxNumber.value = data.max_number;
            manualCodeNumber.value = data.suggested;
          }
        }

        function startAddFlow() {
          if (addMode.value === 'auto') {
            startAutoUpload();
          } else {
            fetchMaxCode();
            addStep.value = 'manual-code';
          }
        }

        async function startAutoUpload() {
          addStep.value = 'auto-progress';
          autoFinished.value = false;
          addError.value = '';
          try {
            const totalBytes = addFileSorted.value.reduce((s, f) => s + f.size, 0) || 1;
            const speed = makeUploadSpeed();
            addUploading.value = true;
            addUploadPct.value = 0;
            addUploadSpeed.value = '';
            const uploadId = await streamUploadParts(addFileSorted.value, addVolume.value, loaded => {
              addUploadPct.value = Math.round(loaded / totalBytes * 100);
              const s = speed(loaded);
              if (s) addUploadSpeed.value = s;
            });
            addUploading.value = false;
            await postJson('/api/videos/add-auto', {
              upload_id: uploadId,
              volume_path: addVolume.value,
              subtitle_classification: addSubtitleClassification.value,
            });
          } catch (e) {
            addError.value = e.message;
          } finally {
            addUploading.value = false;
            autoFinished.value = true;
          }
        }

        async function startManualUpload() {
          manualUploading.value = true;
          addError.value = '';
          try {
            const totalBytes = addFileSorted.value.reduce((s, f) => s + f.size, 0) || 1;
            const speed = makeUploadSpeed();
            addUploading.value = true;
            addUploadPct.value = 0;
            addUploadSpeed.value = '';
            const uploadId = await streamUploadParts(addFileSorted.value, addVolume.value, loaded => {
              addUploadPct.value = Math.round(loaded / totalBytes * 100);
              const s = speed(loaded);
              if (s) addUploadSpeed.value = s;
            });
            addUploading.value = false;
            const data = await postJson('/api/videos/add-manual', {
              upload_id: uploadId,
              volume_path: addVolume.value,
              code_type: manualCodeType.value,
              code_number: manualCodeNumber.value,
              is_multipart: manualIsMultipart.value,
            });
            manualCode.value = data.codes[0];
            addStep.value = 'manual-meta';
          } catch (e) {
            addError.value = e.message;
          } finally {
            addUploading.value = false;
            manualUploading.value = false;
          }
        }

        function toggleManualTag(tag) {
          if (tag === '机翻中文' || tag === '中文字幕') {
            const wasSelected = manualTags.value.includes(tag);
            manualTags.value = manualTags.value.filter(t => t !== '机翻中文' && t !== '中文字幕');
            if (!wasSelected) manualTags.value = [...manualTags.value, tag];
            return;
          }
          if (manualTags.value.includes(tag)) {
            manualTags.value = manualTags.value.filter(t => t !== tag);
          } else {
            manualTags.value = [...manualTags.value, tag];
          }
        }

        async function saveManualMeta() {
          manualSaving.value = true;
          manualMetaError.value = '';
          const code = manualCode.value;
          const body = {
            ...(manualTitleJp.value    ? { title_jp: manualTitleJp.value }           : {}),
            ...(manualTitleZh.value    ? { title_zh: manualTitleZh.value }           : {}),
            ...(manualTitleShort.value ? { title_zh_short: manualTitleShort.value }  : {}),
            actors: manualActors.value.split(',').map(s => s.trim()).filter(Boolean),
            tags:   manualTags.value,
          };
          try {
            const res1 = await fetch(`/api/videos/${code}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res1.ok) {
              const err = await res1.json();
              throw new Error(err.error || 'PATCH 失败');
            }
            const res2 = await fetch(`/api/videos/${code}/finalize-rename`, { method: 'POST' });
            if (!res2.ok) {
              const err2 = await res2.json().catch(() => ({}));
              throw new Error(err2.error || '重命名失败');
            }
            addDoneCode.value = code;
            addStep.value = 'done';
          } catch (e) {
            manualMetaError.value = e.message;
          } finally {
            manualSaving.value = false;
          }
        }

        function goToVideo(code) {
          emit('close');
          router.push(`/video/${baseVideoCode(code)}`);
        }

        return {
          addStep, addFiles, addFileSorted, addVolume, addMode, addSubtitleClassification, addDoneCode, addError,
          mediaLibraries, addFileInput,
          autoFinished,
          addUploading, addUploadPct, addUploadSpeed,
          manualCodeType, manualCodeNumber, manualMaxNumber, manualIsMultipart,
          manualUploading, manualCode, manualTitleJp, manualTitleZh, manualTitleShort,
          manualActors, manualTags, manualSaving, manualMetaError,
          onAddFilesChange, fetchMaxCode, startAddFlow,
          startAutoUpload, startManualUpload, toggleManualTag, saveManualMeta, goToVideo,
        };
      }
    };

    // ── HomeView ──────────────────────────────────────────────
    const HomeView = {
      template: '#tpl-home',
      components: { VideoCard, Pagination, SortBar, AddVideoModal, BatchModal },
      setup() {
        const route = VueRouter.useRoute();
        const router = VueRouter.useRouter();
        const items = ref([]), total = ref(0), limit = 24, loading = ref(true);
        const page = computed(() => parseInt(route.query.page) || 1);
        const sort = computed(() => route.query.sort || 'date');
        const selectedTags = computed(() => queryTags(route.query));

        const filterLabel = computed(() => {
          const q = route.query;
          if (q.year) return `${q.year} 年`;
          if (q.score_min !== undefined || q.score_max !== undefined) {
            const lo = q.score_min, hi = q.score_max;
            if (lo && !hi) return `评分 ≥ ${lo}`;
            if (!lo && hi) return `评分 < ${hi}`;
            return `评分 ${lo} – ${hi}`;
          }
          if (q.has_cover === '1') return '有封面';
          if (q.has_translation === '1') return '已翻译标题';
          if (q.scrape_status) return `刮削状态: ${q.scrape_status}`;
          if (selectedTags.value.length) return selectedTags.value.join(' + ');
          return '';
        });

        async function load() {
          loading.value = true;
          const q = route.query;
          const params = new URLSearchParams({
            page: page.value, limit, sort: sort.value,
            ...(q.year              ? { year: q.year }                         : {}),
            ...(q.score_min        ? { score_min: q.score_min }               : {}),
            ...(q.score_max        ? { score_max: q.score_max }               : {}),
            ...(q.has_cover        ? { has_cover: q.has_cover }               : {}),
            ...(q.has_translation  ? { has_translation: q.has_translation }   : {}),
            ...(q.scrape_status    ? { scrape_status: q.scrape_status }       : {}),
          });
          selectedTags.value.forEach(tag => params.append('tag', tag));
          const d = await apiFetch(`/api/videos?${params}`);
          if (d) { items.value = d.items; total.value = d.total; }
          loading.value = false;
          restoreScroll();
        }
        function changePage(p) { router.push({ query: { ...route.query, page: p } }); }
        function changeSort(s) { router.replace({ query: { ...route.query, sort: s, page: undefined } }); }
        function toggleTag(tag) {
          const tags = selectedTags.value.includes(tag)

    // ── DashboardView ─────────────────────────────────────────
    const DashboardView = {
      template: '#tpl-dashboard',

        const diskUsages = ref([]);
        const imgErr = e => { e.target.style.display = 'none'; };

        const maxByYear = computed(() => stats.value ? Math.max(...stats.value.by_year.map(y => y.count), 1) : 1);
        const maxScoreDist = computed(() => stats.value ? Math.max(...stats.value.score_dist.map(s => s.count), 1) : 1);
        const maxMaker = computed(() => stats.value ? Math.max(...stats.value.top_makers.map(m => m.count), 1) : 1);
        const actorDiskUsage = computed(() => stats.value?.actor_disk_usage || []);
        const maxActorDisk = computed(() => Math.max(...actorDiskUsage.value.map(a => a.size_bytes || 0), 1));
        const diskTotals = computed(() => {
          const available = diskUsages.value.filter(d => d.available);
          const totalGb = available.reduce((sum, d) => sum + (Number(d.total_gb) || 0), 0);
          const usedGb = available.reduce((sum, d) => sum + (Number(d.used_gb) || 0), 0);
          const freeGb = available.reduce((sum, d) => sum + (Number(d.free_gb) || 0), 0);
          return {
            count: available.length,
            totalGb,
            usedGb,
            freeGb,
            freePercent: totalGb ? Math.round(freeGb / totalGb * 1000) / 10 : 0,
          };
        });

        const statCards = computed(() => {
          if (!stats.value) return [];
          return [
            { label: '影片总数', value: stats.value.total_videos },
            { label: '演员', value: stats.value.total_actors },
            { label: '类别', value: stats.value.total_tags },
            { label: '系列', value: stats.value.total_series },
            { label: '已删除', value: stats.value.deleted_videos },
            { label: '已刮削', value: stats.value.scrape_status['SUCCESS'] || 0 },
          ];
        });

        const coverage = computed(() => {
          if (!stats.value) return [];
          return [
            { label: '已翻译标题', value: stats.value.translated, hex: '#6366f1', query: { has_translation: '1' } },
            { label: '有封面',     value: stats.value.has_cover,   hex: '#16a34a', query: { has_cover: '1' } },
          ];
        });

        // Map score range label (from get_stats) to /videos query params
        function scoreRangeQuery(range) {
          if (range === '4.5+')    return { score_min: '4.5' };
          if (range === '4.0-4.5') return { score_min: '4.0', score_max: '4.5' };
          if (range === '3.5-4.0') return { score_min: '3.5', score_max: '4.0' };
          if (range === '3.0-3.5') return { score_min: '3.0', score_max: '3.5' };
          if (range === '<3.0')    return { score_max: '3.0' };
          return {};
        }

        function formatStorage(value) {
          if (value === null || value === undefined) return '-';
          const gb = Number(value) || 0;
          if (gb >= 1024) return `${(gb / 1024).toFixed(1)} TB`;
          return `${gb.toLocaleString()} GB`;
        }

        function formatBytes(value) {
          const gb = (Number(value) || 0) / (1024 ** 3);
          return formatStorage(Math.round(gb * 10) / 10);
        }

        function remainingColor(percent) {
          if (percent <= 10) return '#a33b4c';
          if (percent <= 20) return '#805214';
          return '#22654c';
        }

        function diskPieStyle(percent) {
          const value = Math.max(0, Math.min(100, Number(percent) || 0));
          const color = value <= 10 ? '#dc2626' : value <= 20 ? '#f59e0b' : '#059669';
          return { background: `conic-gradient(${color} 0% ${value}%, #e3e9f2 ${value}% 100%)` };
        }

        function actorDiskBarStyle(sizeBytes) {
          const width = Math.max(2, Math.min(100, (Number(sizeBytes) || 0) / maxActorDisk.value * 100));
          const color = '#6366f1';
          return { width: `${width}%`, backgroundColor: color };
        }

        onMounted(async () => {
          const [statsData, diskData] = await Promise.all([
            apiFetch('/api/stats'),
            apiFetch('/api/config/media-libraries'),
          ]);
          stats.value = statsData;
          diskUsages.value = Array.isArray(diskData) ? diskData : [];
          loading.value = false;
          restoreScroll();
        });

        const showBatchModal = ref(false);
        function openBatchModal() { showBatchModal.value = true; }
        function closeBatchModal() { showBatchModal.value = false; }

        return { stats, loading, diskUsages, diskTotals, actorDiskUsage, maxByYear, maxScoreDist, maxMaker,
          statCards, coverage, scoreRangeQuery, formatStorage, formatBytes, remainingColor,
          diskPieStyle, actorDiskBarStyle, imgErr,
          showBatchModal, openBatchModal, closeBatchModal };
      }
    };

    // ── SearchView ────────────────────────────────────────────

    const VideoDetail = {

        function streamUrl() {

        const player = ref(null), playbackHistory = ref(null), playbackHistoryError = ref('');

          const stream = new URL(element.src);

          const controller = new AbortController();

          async function loadSubtitles(method) {
            try {
              const response = await fetch(url, { method, signal: controller.signal, cache: 'no-store' });
              const data = await response.json();
              if (controller.signal.aborted) return;

        async function copyStreamUrl() {

        // Cover upload

        async function uploadCover(e) {

        // Replace video modal

        const replaceWhole = ref(false);

        const replacePartNum = ref(1);

        const replaceProgress = ref(0);
        const replaceSpeed = ref('');
        const replaceElapsed = ref('');
        const replaceRemaining = ref('');
        const replaceError = ref('');

        watch([replaceFile, replaceSubtitleZh, replaceUncensoredCrackTag, replaceUncensoredNative,
          replaceWhole, replacePartOn, replacePartNum, replaceOriginalPart], async (_, __, onCleanup) => {
          if (!replaceFile.value) return;
          let current = true;
          onCleanup(() => { current = false; });
          replaceFinalName.value = '计算中…';
          const part = replaceWhole.value ? null : replacePartOn.value ? String(replacePartNum.value) : replaceOriginalPart.value || null;
          try {

        function _fmtTime(secs) {
          const s = Math.max(0, Math.floor(secs));
          return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function openReplaceModal() {
          replaceFile.value = null;
          replaceFinalName.value = '';
          replaceSubtitleZh.value = false;
          replaceUncensoredCrackTag.value = 'LTX 无码破解';

          replaceWhole.value = false;

          replaceElapsed.value = '0:00';

          const xhr = new XMLHttpRequest();

            replaceProgress.value = Math.round(e.loaded / e.total * 100);
            replaceElapsed.value = _fmtTime((now - startTime) / 1000);
            const dt = (now - lastTime) / 1000;
            if (dt >= 1) {
              const bps = (e.loaded - lastLoaded) / dt;
              speedSamples.push(bps);
              if (speedSamples.length > 5) speedSamples.shift();
              const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
              replaceSpeed.value = avg >= 1e6 ? (avg / 1e6).toFixed(1) + ' MB/s' : (avg / 1e3).toFixed(0) + ' KB/s';
              replaceRemaining.value = avg > 0 ? _fmtTime((e.total - e.loaded) / avg) : '–';

              }))
              .sort((a, b) => partSortKey(a.part) - partSortKey(b.part));

          return v.original_file_path ? [{
            part: v.part,
            path: v.original_file_path,
            file_size: v.file_size,
            file_mtime: v.file_mtime,
            file_birthtime: v.file_birthtime,

          if (f.score !== '' && f.score !== null) payload.score = parseFloat(f.score);

          let part = '';
          if (segs.length && /^part\w+$/i.test(segs[segs.length - 1])) part = segs.pop();
          const code = segs.shift() || '';
          let title = '';
          if (segs.length && /^\[.*\]$/.test(segs[segs.length - 1])) {

          return { code, actors: segs.join('.'), title, part, ext };

    const RECOMMEND_TTL = 24 * 60 * 60 * 1000; // 24 hours

    const RecommendView = {
      template: '#tpl-recommend',
      components: { VideoCard },
      setup() {
        const items = ref([]);
        const loading = ref(true);
        const selectedTags = ref([]);

        function readCache() {
          if (selectedTags.value.length) return null;
          try {
            const raw = localStorage.getItem(RECOMMEND_CACHE_KEY);
            if (!raw) return null;
            const { ts, data } = JSON.parse(raw);
            if (Date.now() - ts < RECOMMEND_TTL) return data;
          } catch(e) {}
          return null;
        }

        function writeCache(data) {
          if (selectedTags.value.length) return;
          try {
            localStorage.setItem(RECOMMEND_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
          } catch(e) {}
        }

        async function load(force = false) {
          if (!force) {
            const cached = readCache();
            if (cached) { items.value = cached; loading.value = false; return; }
          }
          loading.value = true;
          try {
            const params = new URLSearchParams();
            selectedTags.value.forEach(tag => params.append('tag', tag));
            const qs = params.toString();
            const d = await apiFetch('/api/recommendations' + (qs ? `?${qs}` : ''));
            items.value = d || [];
            if (d) writeCache(d);
          } catch(e) {
            items.value = [];
          } finally {
            loading.value = false;
          }
        }

        function toggleTag(tag) {
          selectedTags.value = selectedTags.value.includes(tag)
            ? selectedTags.value.filter(t => t !== tag)
            : [...selectedTags.value, tag];
          load(true);
        }

        onMounted(() => load(false));
        return { items, loading, filterTags: FILTER_TAGS, selectedTags, toggleTag, load: () => load(true) };

        <nav class="glass-subnav px-4 flex overflow-x-auto" aria-label="主导航">

          <router-link to="/tags" class="nav-tab" :class="{ 'nav-current': $route.path.startsWith('/tag/') }">类别</router-link>
          <router-link to="/actors" class="nav-tab" :class="{ 'nav-current': $route.path.startsWith('/actor/') }">演员</router-link>
          <router-link to="/series" class="nav-tab" :class="{ 'nav-current': $route.path === '/series-detail' }">系列</router-link>
          <router-link to="/prefixes" class="nav-tab" :class="{ 'nav-current': $route.path.startsWith('/prefix/') }">番号</router-link>
          <router-link to="/recommend" class="nav-tab">推荐</router-link>
          <router-link to="/scrape-progress" class="nav-tab nav-operations">刮削进度</router-link>
          <router-link to="/admin" class="nav-tab" :class="{ 'nav-current': $route.path === '/subtitle-review' || $route.path === '/admin/series' }">管理</router-link>
        </nav>
      </div>
      <!-- Page -->
      <main class="site-main" id="main-content" ref="main" tabindex="-1">
        <transition name="fade" mode="out-in">
          <router-view :key="$route.path" />
        </transition>
      </main>
    </div>
  `
    };

    const app = createApp(App);
    app.directive('ltrim', {
      mounted(el) {
        el.addEventListener('input', () => {
          const trimmed = el.value.replace(/^\s+/, '');
          if (trimmed !== el.value) {
            el.value = trimmed;
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      }
    });
    app.use(router).mount('#app');
  </script>
</body>

</html>

              <span v-if="row.forced" class="text-xs text-amber-400 ml-2">立即</span>
              <div v-if="row.status === 'FOUND' || row.status === 'NOT_FOUND'" class="text-xs mt-1 text-gray-500">{{ row.status === 'FOUND' ? '找到链接' : '未找到链接' }}</div>
              <div v-if="row.error" class="text-xs text-red-400 mt-1 break-words">{{ row.error }}</div>
            </td>
            <td class="px-3 py-3 text-gray-500">{{ row.priority || 0 }}</td>
            <td class="px-3 py-3 text-xs text-gray-500 whitespace-nowrap">{{ formatTime(row.queued_at) }}</td>
            <td class="px-3 py-3" style="max-width:320px;min-width:200px"><div v-for="link in row.links" :key="link" class="truncate"><a :href="link" :title="link" class="text-blue-400">{{ link }}</a></div><span v-if="!row.links.length" class="text-gray-600">—</span></td>
            <td class="px-3 py-3 text-center"><input type="checkbox" v-model="row.downloaded" @change="setDownloaded(row)" :disabled="!row.links.length" :aria-label="row.code + ' 已下载'" class="h-4 w-4 accent-indigo-600" /></td>
            <td class="px-3 py-3"><button v-if="row.id" @click="showHistory(row)" class="text-xs text-indigo-400 whitespace-nowrap">查看 {{ row.attempts || 0 }}</button></td>
          </tr>
          <tr v-if="!filteredRows.length"><td colspan="12" class="text-center py-16 text-gray-500">暂无数据</td></tr>
        </tbody>
      </table>
    </div>

    <div v-if="historyCode" class="fixed inset-0 z-50 bg-black bg-opacity-80 flex items-center justify-center p-4" @click.self="historyCode = ''">
      <section class="bg-gray-900 border border-gray-700 rounded-lg w-full max-w-3xl p-5" style="max-height:85vh;overflow:auto" role="dialog" aria-label="刮削历史">
        <div class="flex justify-between items-center mb-4"><h2 class="font-semibold">{{ historyCode }} 执行历史</h2><button @click="historyCode = ''" aria-label="关闭历史" class="text-gray-400 px-2 py-1">×</button></div>
        <div v-for="item in history" :key="item.id" class="border-t border-gray-800 py-3 text-sm">
          <div class="flex gap-3 flex-wrap text-gray-400"><span>{{ statusLabel(item.status) }}</span><span>{{ formatTime(item.finished_at) }}</span><span v-if="item.forced" class="text-amber-400">立即刮削</span></div>
          <p v-if="item.error" class="text-red-400 mt-2 break-words">{{ item.error }}</p>
          <div v-for="link in historyLinks(item)" :key="link" class="break-all mt-2"><a :href="link" class="text-blue-400">{{ link }}</a></div>
        </div>
        <p v-if="!history.length" class="text-gray-500">暂无执行记录</p>
      </section>
    </div>
  </div>
</script>

  <!-- ========== SortBar ========== -->
  <script type="text/x-template" id="tpl-sort-bar">
  <div class="flex items-center gap-1">
    <span class="text-gray-500 text-xs mr-1">排序</span>
    <button @click="$emit('change', 'date')"
      :class="['px-2.5 py-1 rounded text-xs transition', sort === 'date' ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">
      时间
    </button>
    <button @click="$emit('change', 'score')"
      :class="['px-2.5 py-1 rounded text-xs transition', sort === 'score' ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">
      评分
    </button>
    <button @click="$emit('change', 'mtime')"
      :class="['px-2.5 py-1 rounded text-xs transition', sort === 'mtime' ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">
      文件时间
    </button>
  </div>
</script>

  <script>
    const { createApp, ref, computed, watch, onMounted } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // ── scroll position preservation ─────────────────────────
    const _scrollMap = new Map();
    window.addEventListener('scroll', () => {
      _scrollMap.set(window.location.href, window.scrollY);
    }, { passive: true });
    function restoreScroll() {
      const y = _scrollMap.get(window.location.href);
      if (y != null) Vue.nextTick(() => window.scrollTo({ top: y, behavior: 'instant' }));
    }

    // ── helpers ──────────────────────────────────────────────
    async function apiFetch(url, options) {
      const r = await fetch(url, options);
      if (!r.ok) return null;
      return r.json();
    }
    function imgErr(e) { e.target.style.display = 'none'; }
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes >= 1e9) return (bytes / 1e9).toFixed(1) + ' GB';
      return (bytes / 1e6).toFixed(0) + ' MB';
    }
    async function copyText(text, doneRef) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      if (doneRef) {
        doneRef.value = true;
        setTimeout(() => { doneRef.value = false; }, 2000);
      }
    }

    function baseVideoCode(code) {
      return (code || '').replace(/-(?:UC|U|C)$/i, '');
    }

    // ── SortBar ───────────────────────────────────────────────
    const SortBar = {
      name: 'SortBar',
      template: '#tpl-sort-bar',
      props: { sort: { type: String, default: 'date' } },
      emits: ['change'],
    };

    // ── VideoCard ─────────────────────────────────────────────
    const VideoCard = {
      name: 'VideoCard',
      template: '#tpl-video-card',
      props: { video: Object },
      setup(props) {
        const router = VueRouter.useRouter();
        function go() { router.push('/video/' + baseVideoCode(props.video.code)); }
        return { go, imgErr };
      }
    };

    // ── Pagination ────────────────────────────────────────────
    const Pagination = {
      name: 'Pagination',
      template: '#tpl-pagination',
      props: { page: Number, total: Number, limit: Number },
      emits: ['change'],
      setup(props) {
        const totalPages = computed(() => Math.ceil(props.total / props.limit));
        const pages = computed(() => {
          const tp = totalPages.value, cur = props.page, arr = [];
          for (let i = 1; i <= tp; i++) {
            if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) arr.push(i);
            else if (arr[arr.length - 1] !== '...') arr.push('...');
          }
          return arr;
        });
        return { totalPages, pages };
      }
    };

    const FILTER_TAGS = ['无码流出', 'JAV 无码破解', 'LADA 无码破解', 'LTX 无码破解', '原装无码', '中文字幕'];

    function queryTags(query) {
      const raw = query.tag;
      if (!raw) return [];
      return Array.isArray(raw) ? raw : [raw];
    }

    // ── Shared auto-pipeline constants ───────────────────────
    const AUTO_STEPS = [
      'parse_code','calc_dir','upload','db_insert','tags',
      'scrape','actors','translate','short_title',
      'calc_filename','rename','db_update',
    ];
    function autoStepLabel(step) {
      const map = {
        parse_code: '解析番号', calc_dir: '计算目标目录', upload: '上传文件',
        db_insert: '写入数据库', tags: '同步标签', scrape: '刮削影片信息',
        actors: '获取演员信息', translate: '翻译标题', short_title: '计算短标题',
        calc_filename: '计算文件名', rename: '重命名文件', db_update: '更新数据库',
      };
      return map[step] || step;
    }

    // The tag suffix (-C/-U/-UC) belongs on the code, i.e. the first '.'-separated
    // component of the stem — e.g. ABW-123-C.女优.[标题] — not at the end. Mirrors
    // the backend's _compute_final_filename.
    function swapCodeSuffix(stem, hasC, hasU) {
      const suffix = (hasC && hasU) ? '-UC' : hasC ? '-C' : hasU ? '-U' : '';
      const parts = stem.split('.');
      parts[0] = parts[0].replace(/-(?:UC|U|C)$/i, '') + suffix;
      return parts.join('.');
    }

    // Returns a function that, fed cumulative uploaded bytes, yields a smoothed
    // speed string (MB/s · KB/s), throttled to ~2 Hz. null between updates.
    function makeUploadSpeed() {
      let lastLoaded = 0, lastTime = Date.now();
      const samples = [];
      return (loaded) => {
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        if (dt < 0.5) return null;
        const bps = (loaded - lastLoaded) / dt;
        samples.push(bps);
        if (samples.length > 5) samples.shift();
        const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
        lastLoaded = loaded;
        lastTime = now;
        return avg >= 1e6 ? (avg / 1e6).toFixed(1) + ' MB/s' : Math.max(0, avg / 1e3).toFixed(0) + ' KB/s';
      };
    }

    function genUploadId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    // Upload an array of File objects one at a time as raw streamed requests
    // (each < the 50GB cap, written straight to the target volume — no /tmp).
    // onProgress receives cumulative bytes across all parts. Returns the
    // upload_id that groups them; pass it to add-auto / add-manual.
    async function streamUploadParts(files, volumePath, onProgress) {
      const uploadId = genUploadId();
      let priorBytes = 0;
      for (const f of files) {
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/videos/upload-part');
          xhr.setRequestHeader('X-Upload-Id', uploadId);
          xhr.setRequestHeader('X-Volume-Path', encodeURIComponent(volumePath));
          xhr.setRequestHeader('X-Dest-Name', encodeURIComponent(f.name));
          xhr.setRequestHeader('X-File-Size', String(f.size));
          xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable && onProgress) onProgress(priorBytes + e.loaded);
          });
          xhr.addEventListener('load', () => {
            let d; try { d = JSON.parse(xhr.responseText); } catch { d = {}; }
            if (xhr.status === 200) resolve(d);
            else reject(new Error(d.error || `上传失败: ${f.name}`));
          });
          xhr.addEventListener('error', () => reject(new Error(`网络错误，上传失败: ${f.name}`)));
          xhr.send(f);
        });
        priorBytes += f.size;
      }
      return uploadId;
    }

    // POST JSON; parses the response safely and surfaces the real error
    // instead of choking on an HTML error page ("Unexpected token '<'").
    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      let data; try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // ── BatchModal ────────────────────────────────────────────
    const BatchModal = {
      template: '#tpl-batch-modal',
      emits: ['close'],
      setup(props, { emit }) {
        const batchStep       = ref('batch-select');
        const batchFiles      = ref([]);
        const batchChecking   = ref(false);
        const batchCheckError = ref('');
        const batchGroups     = ref([]);
        const batchVolume     = ref('');
        const mediaLibraries  = ref([]);
        const batchProcessing = ref(false);
        const batchResults    = ref([]);

        const batchStepNum = computed(() =>
          ({ 'batch-select': 1, 'batch-review': 2, 'batch-progress': 3 }[batchStep.value] || 1)
        );
        const hasNewGroups  = computed(() => batchGroups.value.some(g => !g.exists && !g.warning));
        const hasWarnings   = computed(() => batchGroups.value.some(g => g.warning));
        const canStartUpload = computed(() =>
          !hasWarnings.value && batchGroups.value.length > 0 &&
          (!hasNewGroups.value || batchVolume.value)
        );

        onMounted(async () => {
          const libs = await apiFetch('/api/config/media-libraries');
          if (libs) mediaLibraries.value = libs;
        });

        function onBatchFilesChange(e) {
          const newFiles = Array.from(e.target.files || []);
          const existingNames = new Set(batchFiles.value.map(f => f.name));
          batchFiles.value = [...batchFiles.value, ...newFiles.filter(f => !existingNames.has(f.name))];
        }

        async function runBatchCheck() {
          batchChecking.value = true;
          batchCheckError.value = '';
          try {
            const resp = await fetch('/api/videos/batch-check', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filenames: batchFiles.value.map(f => f.name) }),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || '检测失败');
            batchGroups.value = buildGroups(data);
            batchStep.value = 'batch-review';
          } catch (e) {
            batchCheckError.value = e.message;
          } finally {
            batchChecking.value = false;
          }
        }

        function buildGroups(items) {
          const map = {};
          for (const item of items) {
            const key = item.code || ('__err__' + item.filename);
            if (!map[key]) {
              map[key] = {
                code: item.code,
                db_code: item.db_code || null,
                files: [],
                exists: item.exists,
                original_path: item.original_path,
                db_parts: item.db_parts || [],
                subtitle_zh: /(?:-UC|-C)$/i.test(item.code || ''),
                subtitle_classification: /(?:-UC|-C)$/i.test(item.code || '') ? '中文字幕' : '',
                uncensored_leaked: /(?:-UC|-U)$/i.test(item.code || ''),
                uncensored_crack_tag: /(?:-UC|-U)$/i.test(item.code || '') ? 'LTX 无码破解' : '',
                uncensored_native: false,
                warning: item.error || null,
              };
            }
            map[key].files.push(item);
            // mixed new+replace in same code → warn
            if (map[key].exists !== null && item.exists !== null && map[key].exists !== item.exists) {
              map[key].warning = '同一番号下新增与替换混合，请检查文件';
            }
          }
          // ambiguous part: replace row but can't tell which part to replace
          for (const g of Object.values(map)) {
            if (!g.warning && g.exists && g.db_parts.length > 1) {
              const allHavePart = g.files.every(f => f.part);
              if (!allHavePart) {
                g.warning = '无法确定 Part，请在文件名中加上 -partN（如 SSIS-456-part1.mp4）';
              }
            }
          }
          return Object.values(map);
        }

        function toggleGroupTag(g, key) {
          const idx = batchGroups.value.indexOf(g);
          if (idx >= 0) {
            batchGroups.value[idx] = { ...g, [key]: !g[key] };
          }
        }

        // Base filename stem the replace writes to (the original on-disk name, sans ext).
        // The backend swaps the -C/-U/-UC suffix on the code component.
        function _replaceBaseStem(group) {
          const origName = group.original_path
            ? group.original_path.split('/').pop()
            : (group.files[0] && group.files[0].filename) || '';
          const dot = origName.lastIndexOf('.');
          const stem = dot > 0 ? origName.slice(0, dot) : origName;
          return stem.replace(/\.part\d+$/i, '');
        }
        function expectedFinalNames(group) {
          const hasC = Boolean(group.subtitle_classification);
          const hasU = Boolean(group.uncensored_crack_tag) || group.uncensored_native;
          const stem = swapCodeSuffix(_replaceBaseStem(group), hasC, hasU);
          return group.files.map(file => {
            const part = file.part ? `.${file.part}` : '';
            const dot = file.filename.lastIndexOf('.');
            const ext = dot > 0 ? file.filename.slice(dot) : '';
            return `${stem}${part}${ext}`;
          });
        }

        async function startBatchProcess() {
          batchStep.value = 'batch-progress';
          batchProcessing.value = true;
          batchResults.value = batchGroups.value.map(g => ({
            code: g.code,
            type: g.exists ? 'replace' : 'new',
            status: 'pending',
            message: '',
            progress: 0,
            speed: '',
            uploaded: false,
            viewCode: null,
            progressSteps: g.exists ? [] : AUTO_STEPS.map(s => ({ step: s, status: 'pending', message: '' })),
          }));

          for (let i = 0; i < batchGroups.value.length; i++) {
            const group = batchGroups.value[i];
            const result = batchResults.value[i];
            result.status = 'running';
            try {
              if (!group.exists) {
                await processNewGroup(group, result);
              } else {
                await processReplaceGroup(group, result);
              }
              result.status = 'done';
            } catch (e) {
              result.status = 'error';
              result.message = e.message;
            }
          }
          batchProcessing.value = false;
        }

        async function processNewGroup(group, result) {
          // Phase 1: stream each part to the target volume, with progress.
          const files = group.files
            .map(fi => batchFiles.value.find(bf => bf.name === fi.filename))
            .filter(Boolean);
          const totalBytes = files.reduce((sum, f) => sum + f.size, 0) || 1;
          const speed = makeUploadSpeed();
          const uploadId = await streamUploadParts(files, batchVolume.value, loaded => {
            result.progress = Math.round(loaded / totalBytes * 100);
            const s = speed(loaded);
            if (s) result.speed = s;
          });
          const data = await postJson('/api/videos/add-auto', {
            upload_id: uploadId,
            volume_path: batchVolume.value,
            uncensored_crack_tag: group.uncensored_crack_tag,
            subtitle_classification: group.subtitle_classification,
          });
          const jobId = data.job_id;
          result.uploaded = true;  // switch UI from progress bar to step list

          // Phase 2: stream pipeline steps.
          await new Promise((resolve, reject) => {
            const es = new EventSource(`/api/jobs/${jobId}/stream`);
            es.onmessage = (e) => {
              let event;
              try { event = JSON.parse(e.data); } catch { return; }
              if (event.step === 'ping') return;
              const idx = result.progressSteps.findIndex(s => s.step === event.step);
              if (idx >= 0) {
                result.progressSteps[idx] = { ...result.progressSteps[idx], ...event };
              }
              if (event.step === 'done') {
                result.viewCode = event.code || group.code;
                es.close();
                resolve();
              } else if (event.step === 'error') {
                es.close();
                reject(new Error(event.message || '处理失败'));
              }
            };
            es.onerror = () => { es.close(); reject(new Error('连接中断')); };
          });
        }

        // POST a raw file body with progress; resolves with parsed JSON, rejects on error.
        function _xhrUpload(url, headers, file, onProgress) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
            xhr.upload.addEventListener('progress', e => {
              if (e.lengthComputable) onProgress(e.loaded);
            });
            xhr.addEventListener('load', () => {
              let data; try { data = JSON.parse(xhr.responseText); } catch { data = {}; }
              if (xhr.status === 200) resolve(data);
              else reject(new Error(data.error || '替换失败'));
            });
            xhr.addEventListener('error', () => reject(new Error('网络错误，上传失败')));
            xhr.send(file);
          });
        }

        async function processReplaceGroup(group, result) {
          const requestCode = group.db_code || group.code;
          let finalCode = requestCode;
          const totalBytes = group.files.reduce((sum, fi) => {
            const f = batchFiles.value.find(bf => bf.name === fi.filename);
            return sum + (f ? f.size : 0);
          }, 0) || 1;
          let loadedBefore = 0;
          const speed = makeUploadSpeed();

          // For each file in the group (usually one, unless replacing multiple parts)
          for (const fi of group.files) {
            const f = batchFiles.value.find(bf => bf.name === fi.filename);
            if (!f) throw new Error(`文件未找到: ${fi.filename}`);

            const originalPart = fi.part;
            const qp = originalPart ? `?part=${encodeURIComponent(originalPart)}` : '';
            // Replace must target the actual DB code (variant may differ from the
            // uploaded file's suffix, e.g. DB has ABW-123-U but file is ABW-123-C).
            const url = `/api/videos/${encodeURIComponent(requestCode)}/replace${qp}`;

            // Send the suffix-stripped base name; backend's _compute_final_filename
            // appends the -C/-U/-UC suffix from the toggles (avoids doubling, e.g.
            // ABW-123-U → ABW-123-U-C). Ext comes from the uploaded file.
            const fDot = f.name.lastIndexOf('.');
            const fExt = fDot > 0 ? f.name.slice(fDot) : '';
            const destName = (_replaceBaseStem(group) + fExt).trim();
            if (!destName) throw new Error('无效的原始文件路径');

            const headers = {
              'X-Dest-Name': encodeURIComponent(destName),
              'X-File-Size': String(f.size),
              'X-Subtitle-Zh': group.subtitle_classification ? '1' : '0',
              'X-Subtitle-Classification': encodeURIComponent(group.subtitle_classification || ''),
              'X-Uncensored-Leaked': group.uncensored_crack_tag ? '1' : '0',
              'X-Uncensored-Crack-Tag': encodeURIComponent(group.uncensored_crack_tag || ''),
              'X-Uncensored-Native': group.uncensored_native ? '1' : '0',
            };
            if (originalPart) headers['X-Part'] = originalPart;

            result.message = group.files.length > 1 ? `上传中… (${fi.filename})` : '上传中…';
            const replaceResponse = await _xhrUpload(url, headers, f, loaded => {
              result.progress = Math.round((loadedBefore + loaded) / totalBytes * 100);
              const s = speed(loadedBefore + loaded);
              if (s) result.speed = s;
            });
            finalCode = replaceResponse.new_code || replaceResponse.code || finalCode;
            loadedBefore += f.size;
          }
          result.progress = 100;
          result.viewCode = finalCode;
          result.code = finalCode;
          result.message = '替换完成';
        }

        return {
          batchStep, batchFiles, batchChecking, batchCheckError,
          batchGroups, batchVolume, mediaLibraries,
          batchProcessing, batchResults,
          batchStepNum, hasNewGroups, hasWarnings, canStartUpload,
          autoStepLabel,
          onBatchFilesChange, runBatchCheck, buildGroups, toggleGroupTag, expectedFinalNames,
          startBatchProcess, processNewGroup, processReplaceGroup,
        };
      }
    };

    // ── AddVideoModal ─────────────────────────────────────────
    const AddVideoModal = {
      template: '#tpl-add-video',
      props: { initialStep: { type: String, default: 'file-select' } },
      emits: ['close'],
      setup(props, { emit }) {
        const router = VueRouter.useRouter();

        // ── Shared state ────────────────────────────────────────
        const addStep    = ref(props.initialStep);
        const addFiles   = ref([]);
        const addVolume  = ref('');
        const addMode    = ref('auto');
        const addSubtitleClassification = ref('');
        const addDoneCode = ref('');
        const addError   = ref('');

        const mediaLibraries = ref([]);
        const addFileInput = ref(null);

        // ── Auto mode state ─────────────────────────────────────
        const autoProgressSteps = ref([]);
        const autoFinished = ref(false);

        // Shared upload progress (single auto/manual add).
        const addUploading  = ref(false);
        const addUploadPct  = ref(0);
        const addUploadSpeed = ref('');

        const autoProgressPct = computed(() => {
          const done = autoProgressSteps.value.filter(s => s.status === 'done').length;
          return Math.round((done / AUTO_STEPS.length) * 100);
        });

        // ── Manual mode state ────────────────────────────────────
        const manualCodeType    = ref('WEST');
        const manualCodeNumber  = ref(1);
        const manualMaxNumber   = ref(0);
        const manualIsMultipart = ref(false);
        const manualUploading   = ref(false);
        const manualCode        = ref('');
        const manualTitleJp     = ref('');
        const manualTitleZh     = ref('');
        const manualTitleShort  = ref('');
        const manualActors      = ref('');
        const manualTags        = ref([]);
        const manualSaving      = ref(false);
        const manualMetaError   = ref('');

        const addFileSorted = computed(() =>
          [...addFiles.value].sort((a, b) => a.name.localeCompare(b.name))
        );

        // ── Lifecycle ────────────────────────────────────────────
        onMounted(async () => {
          const libs = await apiFetch('/api/config/media-libraries');
          if (libs) mediaLibraries.value = libs;
          if (props.initialStep === 'manual-code') await fetchMaxCode();
        });

        // ── Handlers ─────────────────────────────────────────────
        function onAddFilesChange(e) {
          addFiles.value = Array.from(e.target.files || []);
          addSubtitleClassification.value = addFiles.value.some(f => /-(?:UC|C)(?:\.|$)/i.test(f.name))
            ? '中文字幕' : '';
          if (addFiles.value.length > 1) manualIsMultipart.value = true;
        }

        async function fetchMaxCode() {
          const data = await apiFetch(`/api/videos/max-code/${manualCodeType.value}`);
          if (data) {
            manualMaxNumber.value = data.max_number;
            manualCodeNumber.value = data.suggested;
          }
        }

        function startAddFlow() {
          if (addMode.value === 'auto') {
            startAutoUpload();
          } else {
            fetchMaxCode();
            addStep.value = 'manual-code';
          }
        }

        async function startAutoUpload() {
          addStep.value = 'auto-progress';
          autoFinished.value = false;
          addError.value = '';
          autoProgressSteps.value = AUTO_STEPS.map(s => ({ step: s, status: 'pending', message: '' }));

          let jobId;
          try {
            const totalBytes = addFileSorted.value.reduce((s, f) => s + f.size, 0) || 1;
            const speed = makeUploadSpeed();
            addUploading.value = true;
            addUploadPct.value = 0;
            addUploadSpeed.value = '';
            const uploadId = await streamUploadParts(addFileSorted.value, addVolume.value, loaded => {
              addUploadPct.value = Math.round(loaded / totalBytes * 100);
              const s = speed(loaded);
              if (s) addUploadSpeed.value = s;
            });
            addUploading.value = false;
            const data = await postJson('/api/videos/add-auto', {
              upload_id: uploadId,
              volume_path: addVolume.value,
              subtitle_classification: addSubtitleClassification.value,
            });
            jobId = data.job_id;
          } catch (e) {
            addUploading.value = false;
            addError.value = e.message;
            autoFinished.value = true;
            return;
          }

          const es = new EventSource(`/api/jobs/${jobId}/stream`);
          es.onmessage = (e) => {
            const event = JSON.parse(e.data);
            if (event.step === 'ping') return;
            const idx = autoProgressSteps.value.findIndex(s => s.step === event.step);
            if (idx >= 0) {
              autoProgressSteps.value[idx] = { ...autoProgressSteps.value[idx], ...event };
            } else {
              autoProgressSteps.value.push(event);
            }
            if (event.step === 'done') {
              addDoneCode.value = event.code || '';
              autoFinished.value = true;
              addStep.value = 'done';
              es.close();
            } else if (event.step === 'error') {
              addError.value = event.message;
              autoFinished.value = true;
              es.close();
            }
          };
          es.onerror = () => {
            addError.value = '连接中断';
            autoFinished.value = true;
            es.close();
          };
        }

        async function startManualUpload() {
          manualUploading.value = true;
          addError.value = '';
          try {
            const totalBytes = addFileSorted.value.reduce((s, f) => s + f.size, 0) || 1;
            const speed = makeUploadSpeed();
            addUploading.value = true;
            addUploadPct.value = 0;
            addUploadSpeed.value = '';
            const uploadId = await streamUploadParts(addFileSorted.value, addVolume.value, loaded => {
              addUploadPct.value = Math.round(loaded / totalBytes * 100);
              const s = speed(loaded);
              if (s) addUploadSpeed.value = s;
            });
            addUploading.value = false;
            const data = await postJson('/api/videos/add-manual', {
              upload_id: uploadId,
              volume_path: addVolume.value,
              code_type: manualCodeType.value,
              code_number: manualCodeNumber.value,
              is_multipart: manualIsMultipart.value,
            });
            manualCode.value = data.codes[0];
            addStep.value = 'manual-meta';
          } catch (e) {
            addError.value = e.message;
          } finally {
            addUploading.value = false;
            manualUploading.value = false;
          }
        }

        function toggleManualTag(tag) {
          if (tag === '机翻中文' || tag === '中文字幕') {
            const wasSelected = manualTags.value.includes(tag);
            manualTags.value = manualTags.value.filter(t => t !== '机翻中文' && t !== '中文字幕');
            if (!wasSelected) manualTags.value = [...manualTags.value, tag];
            return;
          }
          if (manualTags.value.includes(tag)) {
            manualTags.value = manualTags.value.filter(t => t !== tag);
          } else {
            manualTags.value = [...manualTags.value, tag];
          }
        }

        async function saveManualMeta() {
          manualSaving.value = true;
          manualMetaError.value = '';
          const code = manualCode.value;
          const body = {
            ...(manualTitleJp.value    ? { title_jp: manualTitleJp.value }           : {}),
            ...(manualTitleZh.value    ? { title_zh: manualTitleZh.value }           : {}),
            ...(manualTitleShort.value ? { title_zh_short: manualTitleShort.value }  : {}),
            actors: manualActors.value.split(',').map(s => s.trim()).filter(Boolean),
            tags:   manualTags.value,
          };
          try {
            const res1 = await fetch(`/api/videos/${code}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res1.ok) {
              const err = await res1.json();
              throw new Error(err.error || 'PATCH 失败');
            }
            const res2 = await fetch(`/api/videos/${code}/finalize-rename`, { method: 'POST' });
            if (!res2.ok) {
              const err2 = await res2.json().catch(() => ({}));
              throw new Error(err2.error || '重命名失败');
            }
            addDoneCode.value = code;
            addStep.value = 'done';
          } catch (e) {
            manualMetaError.value = e.message;
          } finally {
            manualSaving.value = false;
          }
        }

        function goToVideo(code) {
          emit('close');
          router.push(`/video/${baseVideoCode(code)}`);
        }

        return {
          addStep, addFiles, addFileSorted, addVolume, addMode, addSubtitleClassification, addDoneCode, addError,
          mediaLibraries, addFileInput,
          autoProgressSteps, autoProgressPct, autoFinished,
          addUploading, addUploadPct, addUploadSpeed,
          autoStepLabel,
          manualCodeType, manualCodeNumber, manualMaxNumber, manualIsMultipart,
          manualUploading, manualCode, manualTitleJp, manualTitleZh, manualTitleShort,
          manualActors, manualTags, manualSaving, manualMetaError,
          onAddFilesChange, fetchMaxCode, startAddFlow,
          startAutoUpload, startManualUpload, toggleManualTag, saveManualMeta, goToVideo,
        };
      }
    };

    // ── HomeView ──────────────────────────────────────────────
    const HomeView = {
      template: '#tpl-home',
      components: { VideoCard, Pagination, SortBar, AddVideoModal, BatchModal },
      setup() {
        const route = VueRouter.useRoute();
        const router = VueRouter.useRouter();
        const items = ref([]), total = ref(0), limit = 24, loading = ref(true);
        const page = computed(() => parseInt(route.query.page) || 1);
        const sort = computed(() => route.query.sort || 'date');
        const selectedTags = computed(() => queryTags(route.query));

        const filterLabel = computed(() => {
          const q = route.query;
          if (q.year) return `${q.year} 年`;
          if (q.score_min !== undefined || q.score_max !== undefined) {
            const lo = q.score_min, hi = q.score_max;
            if (lo && !hi) return `评分 ≥ ${lo}`;
            if (!lo && hi) return `评分 < ${hi}`;
            return `评分 ${lo} – ${hi}`;
          }
          if (q.has_cover === '1') return '有封面';
          if (q.has_translation === '1') return '已翻译标题';
          if (q.scrape_status) return `刮削状态: ${q.scrape_status}`;
          if (selectedTags.value.length) return selectedTags.value.join(' + ');
          return '';
        });

        async function load() {
          loading.value = true;
          const q = route.query;
          const params = new URLSearchParams({
            page: page.value, limit, sort: sort.value,
            ...(q.year              ? { year: q.year }                         : {}),
            ...(q.score_min        ? { score_min: q.score_min }               : {}),
            ...(q.score_max        ? { score_max: q.score_max }               : {}),
            ...(q.has_cover        ? { has_cover: q.has_cover }               : {}),
            ...(q.has_translation  ? { has_translation: q.has_translation }   : {}),
            ...(q.scrape_status    ? { scrape_status: q.scrape_status }       : {}),
          });
          selectedTags.value.forEach(tag => params.append('tag', tag));
          const d = await apiFetch(`/api/videos?${params}`);
          if (d) { items.value = d.items; total.value = d.total; }
          loading.value = false;
          restoreScroll();
        }
        function changePage(p) { router.push({ query: { ...route.query, page: p } }); }
        function changeSort(s) { router.replace({ query: { ...route.query, sort: s, page: undefined } }); }
        function toggleTag(tag) {
          const tags = selectedTags.value.includes(tag)
            ? selectedTags.value.filter(t => t !== tag)
            : [...selectedTags.value, tag];
          router.replace({ query: { ...route.query, tag: tags.length ? tags : undefined, page: undefined } });
        }
        watch(() => route.query, load, { deep: true });
        onMounted(load);

        const showAddModal = ref(false);
        function openAddModal() { showAddModal.value = true; }
        function closeAddModal() { showAddModal.value = false; }

        const showManualModal = ref(false);
        function openManualModal() { showManualModal.value = true; }
        function closeManualModal() { showManualModal.value = false; }

        const showBatchModal = ref(false);
        function openBatchModal() { showBatchModal.value = true; }
        function closeBatchModal() { showBatchModal.value = false; }

        // ── Re-scrape (FAILED / PENDING filter) ──────────────────
        const rescrapeFilterStatus = computed(() => {
          const s = (route.query.scrape_status || '').toUpperCase();
          return (s === 'FAILED' || s === 'PENDING') ? s : null;
        });
        const showRescrape    = ref(false);
        const rescrapeStarted = ref(false);
        const rescrapeRunning = ref(false);
        const rescrapeItems   = ref([]);
        const rescrapeSummary = ref('');
        function openRescrape() {
          rescrapeStarted.value = false;
          rescrapeRunning.value = false;
          rescrapeItems.value = [];
          rescrapeSummary.value = '';
          showRescrape.value = true;
        }
        function closeRescrape() {
          if (rescrapeRunning.value) return;
          showRescrape.value = false;
          if (rescrapeStarted.value) load();  // refresh list after a run
        }
        async function startRescrape() {
          rescrapeStarted.value = true;
          rescrapeRunning.value = true;
          try {
            const res = await fetch('/api/videos/rescrape', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ scrape_status: rescrapeFilterStatus.value }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '启动失败');
            rescrapeItems.value = data.codes.map(c => ({ code: c, status: 'pending', message: '' }));
            const es = new EventSource(`/api/jobs/${data.job_id}/stream`);
            es.onmessage = (e) => {
              let event; try { event = JSON.parse(e.data); } catch { return; }
              if (event.step === 'ping') return;
              if (event.step === 'done') {
                rescrapeSummary.value = event.message || '';
                rescrapeRunning.value = false;
                es.close();
                return;
              }
              const idx = rescrapeItems.value.findIndex(r => r.code === event.step);
              if (idx >= 0) {
                rescrapeItems.value[idx] = { code: event.step, status: event.status, message: event.message };
              }
            };
            es.onerror = () => { rescrapeRunning.value = false; es.close(); };
          } catch (e) {
            rescrapeSummary.value = e.message;
            rescrapeRunning.value = false;
          }
        }

        return {
          items, total, page, limit, loading, sort, filterLabel,
          filterTags: FILTER_TAGS, selectedTags, changePage, changeSort, toggleTag,
          showAddModal, openAddModal, closeAddModal,
          showManualModal, openManualModal, closeManualModal,
          showBatchModal, openBatchModal, closeBatchModal,
          rescrapeFilterStatus, showRescrape, rescrapeStarted, rescrapeRunning,
          rescrapeItems, rescrapeSummary, openRescrape, closeRescrape, startRescrape,
        };
      }
    };

    // ── DashboardView ─────────────────────────────────────────
    const DashboardView = {

        const diskUsages = ref([]);
        const imgErr = e => { e.target.style.display = 'none'; };

        const maxByYear = computed(() => stats.value ? Math.max(...stats.value.by_year.map(y => y.count), 1) : 1);
        const maxScoreDist = computed(() => stats.value ? Math.max(...stats.value.score_dist.map(s => s.count), 1) : 1);
        const maxMaker = computed(() => stats.value ? Math.max(...stats.value.top_makers.map(m => m.count), 1) : 1);
        const actorDiskUsage = computed(() => stats.value?.actor_disk_usage || []);
        const maxActorDisk = computed(() => Math.max(...actorDiskUsage.value.map(a => a.size_bytes || 0), 1));
        const diskTotals = computed(() => {
          const available = diskUsages.value.filter(d => d.available);
          const totalGb = available.reduce((sum, d) => sum + (Number(d.total_gb) || 0), 0);
          const usedGb = available.reduce((sum, d) => sum + (Number(d.used_gb) || 0), 0);
          const freeGb = available.reduce((sum, d) => sum + (Number(d.free_gb) || 0), 0);
          return {
            count: available.length,
            totalGb,
            usedGb,
            freeGb,
            freePercent: totalGb ? Math.round(freeGb / totalGb * 1000) / 10 : 0,
          };
        });

        const statCards = computed(() => {
          if (!stats.value) return [];
          return [
            { label: '影片总数', value: stats.value.total_videos },
            { label: '演员', value: stats.value.total_actors },
            { label: '类别', value: stats.value.total_tags },
            { label: '系列', value: stats.value.total_series },
            { label: '已删除', value: stats.value.deleted_videos },
            { label: '已刮削', value: stats.value.scrape_status['SUCCESS'] || 0 },
          ];
        });

        const coverage = computed(() => {
          if (!stats.value) return [];
          return [
            { label: '已翻译标题', value: stats.value.translated, hex: '#6366f1', query: { has_translation: '1' } },
            { label: '有封面',     value: stats.value.has_cover,   hex: '#16a34a', query: { has_cover: '1' } },
          ];

          if (range === '4.5+')    return { score_min: '4.5' };
          if (range === '4.0-4.5') return { score_min: '4.0', score_max: '4.5' };
          if (range === '3.5-4.0') return { score_min: '3.5', score_max: '4.0' };
          if (range === '3.0-3.5') return { score_min: '3.0', score_max: '3.5' };
          if (range === '<3.0')    return { score_max: '3.0' };
          return {};
        }

        function formatStorage(value) {
          if (value === null || value === undefined) return '-';
          const gb = Number(value) || 0;
          if (gb >= 1024) return `${(gb / 1024).toFixed(1)} TB`;
          return `${gb.toLocaleString()} GB`;
        }

        function formatBytes(value) {
          const gb = (Number(value) || 0) / (1024 ** 3);
          return formatStorage(Math.round(gb * 10) / 10);
        }

        function remainingColor(percent) {
          if (percent <= 10) return '#fca5a5';
          if (percent <= 20) return '#fcd34d';
          return '#6ee7b7';

          const value = Math.max(0, Math.min(100, Number(percent) || 0));

        const q = computed(() => route.query.q || '');
        async function load() {
          if (!q.value) return;
          loading.value = true;
          const d = await apiFetch(`/api/search?q=${encodeURIComponent(q.value)}&page=${page.value}&limit=${limit}`);
          if (d) { items.value = d.items; total.value = d.total; }
          loading.value = false;
          restoreScroll();
        }
        function changePage(p) { page.value = p; window.scrollTo(0, 0); }
        watch([q], () => { page.value = 1; load(); });
        watch(page, load);
        onMounted(load);
        return { items, total, page, limit, loading, q, changePage };
      }
    };

    // ── VideoDetail ───────────────────────────────────────────
    const EDIT_FIELDS = [
      { key: 'title_zh', label: '中文标题' },
      { key: 'title_jp', label: '日文标题' },
      { key: 'release_date', label: '发行日期' },
      { key: 'duration', label: '时长' },
      { key: 'maker', label: '制片方' },
      { key: 'publisher', label: '发行商' },
      { key: 'series', label: '系列' },
      { key: 'score', label: '评分', type: 'number', step: '0.01' },
    ];

    const VideoDetail = {
      template: '#tpl-video-detail',
      setup() {
        const route = VueRouter.useRoute();
        const router = VueRouter.useRouter();
        const video = ref(null), loading = ref(true);
        const editing = ref(false), saving = ref(false), saveError = ref('');
        const rescraping = ref(false), rescrapeMessage = ref(''), rescrapeError = ref(false);
        const form = ref({});
        const actorSuggestions = ref([]);
        const seriesSuggestions = ref([]);
        const allTags = ref([]);
        const tagSuggestions = ref([]);
        const pickedSeriesClusterId = ref(null);
        let actorTimer = null, seriesTimer = null;

        // Streaming
        const selectedPart = ref(''), copied = ref(false);
        const copiedPaths = ref({});
        function streamUrl() {
          // 取文件扩展名（供 VRPlayer 等依赖 URL 后缀识别格式的播放器使用）
          const filePath = (video.value.parts && video.value.parts.length > 0)
            ? (video.value.parts.find(p => p.part === selectedPart.value) || video.value.parts[0]).original_file_path
            : video.value.original_file_path;
          const ext = filePath ? filePath.split('.').pop().toLowerCase() : 'mp4';
          const base = window.location.origin + '/api/videos/' + baseVideoCode(video.value.code) + '/stream.' + ext;
          return selectedPart.value ? base + '?part=' + encodeURIComponent(selectedPart.value) : base;
        }
        function playVideo() { window.open(streamUrl(), '_blank'); }
        async function copyStreamUrl() {
          const url = streamUrl();
          try {
            await navigator.clipboard.writeText(url);
          } catch (e) {
            // Safari 隐身模式 fallback
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          copied.value = true;
          setTimeout(() => { copied.value = false; }, 2000);
        }

        // Cover upload
        const coverFileInput = ref(null), coverUploading = ref(false), coverSrc = ref('');
        function triggerCoverUpload() { if (coverFileInput.value) coverFileInput.value.click(); }
        async function uploadCover(e) {
          const file = e.target.files[0];
          if (!file) return;
          coverUploading.value = true;
          const fd = new FormData();
          fd.append('file', file);
          try {
            const res = await apiFetch('/api/videos/' + video.value.code + '/cover', { method: 'POST', body: fd });
            if (res && res.cover_path) {
              coverSrc.value = '/static/' + res.cover_path + '?t=' + Date.now();
              video.value.cover_path = res.cover_path;
            }
          } finally {
            coverUploading.value = false;
            e.target.value = '';
          }
        }

        // Replace video modal
        const showReplaceModal = ref(false);
        const replaceOriginalPart = ref('');
        const replaceFile = ref(null);
        const replaceDestName = ref('');
        const replaceSubtitleZh = ref(false);
        const replaceUncensoredCrackTag = ref('LTX 无码破解');
        const replaceUncensoredNative = ref(false);
        const replaceWhole = ref(false);
        const replacePartOn = ref(false);
        const replacePartNum = ref(1);
        const replacePartOther = ref(false);
        const replaceUploading = ref(false);
        const replaceProgress = ref(0);
        const replaceSpeed = ref('');
        const replaceElapsed = ref('');
        const replaceRemaining = ref('');
        const replaceError = ref('');

        const replaceFinalName = computed(() => {
          if (!replaceDestName.value) return '';
          const name = replaceDestName.value;
          const dot = name.lastIndexOf('.');
          const stem = dot > 0 ? name.slice(0, dot) : name;
          const ext  = dot > 0 ? name.slice(dot) : '';
          const hasC = replaceSubtitleZh.value;
          const hasU = Boolean(replaceUncensoredCrackTag.value) || replaceUncensoredNative.value;
          const cleanStem = replaceWhole.value ? stem.replace(/\.part\d+$/i, '') : stem;
          const newStem = swapCodeSuffix(cleanStem, hasC, hasU);
          const partSeg = !replaceWhole.value && replacePartOn.value && replacePartNum.value ? `.part${replacePartNum.value}` : '';
          return `${newStem}${partSeg}${ext}`;
        });

        function _fmtTime(secs) {
          const s = Math.max(0, Math.floor(secs));
          return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function _getOriginalPathForPart(part) {
          const v = video.value;
          if (v.parts && v.parts.length > 1) {
            const found = v.parts.find(p => (p.part || '') === part);
            return found ? found.original_file_path : v.original_file_path;
          }
          return v.original_file_path;
        }

        function openReplaceModal() {
          replaceFile.value = null;
          replaceDestName.value = '';
          replaceSubtitleZh.value = false;
          replaceUncensoredCrackTag.value = 'LTX 无码破解';
          replaceUncensoredNative.value = false;
          replaceWhole.value = false;
          replaceUploading.value = false;
          replaceProgress.value = 0;
          replaceSpeed.value = '';
          replaceElapsed.value = '';
          replaceRemaining.value = '';
          replaceError.value = '';
          replaceOriginalPart.value = selectedPart.value || '';
          const m = replaceOriginalPart.value.match(/(\d+)$/);
          if (m) {
            const n = parseInt(m[1]);
            replacePartOn.value = true; replacePartNum.value = n;
            replacePartOther.value = n > 3;
          } else { replacePartOn.value = false; replacePartNum.value = 1; replacePartOther.value = false; }
          showReplaceModal.value = true;
        }

        function closeReplaceModal() {
          if (replaceUploading.value) return;
          showReplaceModal.value = false;
        }

        function onReplaceFileChange(e) {
          const file = e.target.files[0];
          if (!file) return;
          replaceFile.value = file;
          replaceError.value = '';
          // Auto-detect tags from the uploaded filename's code component.
          const upCode = file.name.replace(/\.[^.]+$/, '').split('.')[0];
          replaceSubtitleZh.value = /(?:-UC|-C)$/i.test(upCode);
          const origPath = _getOriginalPathForPart(replaceOriginalPart.value);
          if (origPath) {
            const origFilename = origPath.split('/').pop();
            const dot = origFilename.lastIndexOf('.');
            const origStem = dot > 0 ? origFilename.slice(0, dot) : origFilename;
            // Strip the existing tag suffix from the code component (first segment).
            const baseParts = origStem.split('.');
            baseParts[0] = baseParts[0].replace(/-(?:UC|U|C)$/i, '');
            let baseStem = baseParts.join('.');
            if (replaceWhole.value) baseStem = baseStem.replace(/\.part\d+$/i, '');
            const uploadDot = file.name.lastIndexOf('.');
            const uploadExt = uploadDot > 0 ? file.name.slice(uploadDot) : '';
            replaceDestName.value = baseStem + uploadExt;
          } else {
            replaceDestName.value = file.name;
          }
        }

        function startReplaceUpload() {
          if (!replaceFile.value || replaceUploading.value) return;
          replaceUploading.value = true;
          replaceError.value = '';
          replaceProgress.value = 0;
          replaceSpeed.value = '–';
          replaceElapsed.value = '0:00';
          replaceRemaining.value = '–';

          const qs = replaceOriginalPart.value ? '?part=' + encodeURIComponent(replaceOriginalPart.value) : '';
          const xhr = new XMLHttpRequest();
          const startTime = Date.now();
          let lastLoaded = 0, lastTime = startTime;
          const speedSamples = [];

          xhr.upload.addEventListener('progress', e => {
            if (!e.lengthComputable) return;
            const now = Date.now();
            replaceProgress.value = Math.round(e.loaded / e.total * 100);
            replaceElapsed.value = _fmtTime((now - startTime) / 1000);
            const dt = (now - lastTime) / 1000;
            if (dt >= 1) {
              const bps = (e.loaded - lastLoaded) / dt;
              speedSamples.push(bps);
              if (speedSamples.length > 5) speedSamples.shift();
              const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
              replaceSpeed.value = avg >= 1e6 ? (avg / 1e6).toFixed(1) + ' MB/s' : (avg / 1e3).toFixed(0) + ' KB/s';
              replaceRemaining.value = avg > 0 ? _fmtTime((e.total - e.loaded) / avg) : '–';
              lastLoaded = e.loaded;
              lastTime = now;
            }
          });

          xhr.addEventListener('load', () => {
            replaceUploading.value = false;
            if (xhr.status === 200) {
              try { video.value = JSON.parse(xhr.responseText); } catch (_) {}
              showReplaceModal.value = false;
            } else {
              let msg = '上传失败';
              try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
              replaceError.value = msg;
            }
          });

          xhr.addEventListener('error', () => {
            replaceUploading.value = false;
            replaceError.value = '网络错误，上传失败';
          });

          xhr.open('POST', '/api/videos/' + video.value.code + '/replace' + qs);
          xhr.setRequestHeader('X-Dest-Name', encodeURIComponent(replaceDestName.value));
          xhr.setRequestHeader('X-File-Size', String(replaceFile.value.size));
          xhr.setRequestHeader('X-Subtitle-Zh', replaceSubtitleZh.value ? '1' : '0');
          xhr.setRequestHeader('X-Uncensored-Leaked', '1');
          xhr.setRequestHeader('X-Uncensored-Crack-Tag', encodeURIComponent(replaceUncensoredCrackTag.value));
          xhr.setRequestHeader('X-Uncensored-Native', replaceUncensoredNative.value ? '1' : '0');
          if (replaceWhole.value) xhr.setRequestHeader('X-Replace-Whole', '1');
          if (!replaceWhole.value && replacePartOn.value && replacePartNum.value) xhr.setRequestHeader('X-Part', String(replacePartNum.value));
          xhr.send(replaceFile.value);
        }

        watch(replaceOriginalPart, () => {
          if (replaceFile.value) {
            replaceFile.value = null;
            replaceDestName.value = '';
          }
        });

        watch(replaceWhole, () => {
          if (replaceWhole.value && replaceDestName.value) {
            const dot = replaceDestName.value.lastIndexOf('.');
            const stem = dot > 0 ? replaceDestName.value.slice(0, dot) : replaceDestName.value;
            const ext = dot > 0 ? replaceDestName.value.slice(dot) : '';
            replaceDestName.value = stem.replace(/\.part\d+$/i, '') + ext;
          }
        });

        // Delete
        async function confirmDelete() {
          if (!confirm(`确认删除「${video.value.code}」？物理文件将被删除，数据库记录保留。`)) return;
          const res = await apiFetch('/api/videos/' + video.value.code, { method: 'DELETE' });
          if (res && res.ok) video.value.deleted = 1;
        }

        // Code rename
        const editingCode = ref(false), codeDraft = ref('');
        function startEditCode() { codeDraft.value = video.value.code; editingCode.value = true; }
        function cancelEditCode() { editingCode.value = false; }
        async function saveCode() {
          const newCode = codeDraft.value.trim();
          if (!newCode || newCode === video.value.code) { editingCode.value = false; return; }
          rescrapeError.value = false;
          rescrapeMessage.value = '';
          const res = await apiFetch('/api/videos/' + video.value.code, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: newCode }),
          });
          editingCode.value = false;
          if (res && res.new_code) {
            const renameRes = await fetch('/api/videos/' + encodeURIComponent(res.new_code) + '/finalize-rename', {
              method: 'POST',
            });
            if (!renameRes.ok) {
              const err = await renameRes.json().catch(() => ({}));
              rescrapeError.value = true;
              rescrapeMessage.value = err.error || '文件重命名失败';
            } else {
              rescrapeMessage.value = '番号和文件路径已更新';
            }
            router.replace('/video/' + encodeURIComponent(res.new_code));
          }
        }

        const meta = computed(() => {
          if (!video.value) return [];
          const v = video.value;
          const rows = [
            { label: '发行日期', val: v.release_date, link: null },
            { label: '时长', val: v.duration, link: null },
            { label: '制片方', val: v.maker, link: v.maker ? { path: '/search', query: { q: v.maker } } : null },
            { label: '发行商', val: v.publisher, link: v.publisher ? { path: '/search', query: { q: v.publisher } } : null },
            { label: '系列', val: v.series_zh || v.series, link: v.series ? (v.series_cluster_id ? { path: '/series-detail', query: { cid: v.series_cluster_id, name: v.series_zh || v.series } } : { path: '/series-detail', query: { s: v.series } }) : null },
          ];
          return rows.filter(r => r.val);
        });
        function partSortKey(part) {
          if (!part) return 0;
          const m = part.match(/(\d+)$/);
          return m ? parseInt(m[1]) : 0;
        }
        const fileParts = computed(() => {
          if (!video.value) return [];
          const v = video.value;
          if (v.parts && v.parts.length > 1) {
            return v.parts
              .map(p => ({
                part: p.part,
                path: p.original_file_path,
                file_size: p.file_size,
                file_mtime: p.file_mtime,
                file_birthtime: p.file_birthtime,
              }))
              .sort((a, b) => partSortKey(a.part) - partSortKey(b.part));
          }
          return v.original_file_path ? [{
            part: v.part,
            path: v.original_file_path,
            file_size: v.file_size,
            file_mtime: v.file_mtime,
            file_birthtime: v.file_birthtime,
          }] : [];
        });
        const selectedFileMeta = computed(() => {
          if (!video.value) return {};
          if (fileParts.value.length > 1) {
            if (selectedPart.value) {
              return fileParts.value.find(f => f.part === selectedPart.value) || {};
            }
            return { file_size: video.value.total_file_size, isTotal: true };
          }
          return fileParts.value[0] || {};
        });

        async function load() {
          loading.value = true;
          video.value = await apiFetch('/api/videos/' + route.params.code);
          loading.value = false;
          if (video.value) {
            const canonicalRouteCode = baseVideoCode(video.value.code);
            if (route.params.code !== canonicalRouteCode) {
              router.replace('/video/' + encodeURIComponent(canonicalRouteCode));
            }
          }
          restoreScroll();
        }

        async function startRescrape() {
          if (!video.value || rescraping.value) return;
          rescraping.value = true;
          rescrapeError.value = false;
          rescrapeMessage.value = '正在启动重新刮削…';
          try {
            const res = await fetch('/api/videos/' + encodeURIComponent(video.value.code) + '/rescrape', {
              method: 'POST',
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '启动失败');

            const es = new EventSource('/api/jobs/' + data.job_id + '/stream');
            es.onmessage = async (e) => {
              let event; try { event = JSON.parse(e.data); } catch { return; }
              if (event.step === 'ping') return;
              if (event.step === 'error') {
                rescrapeError.value = true;
                rescrapeMessage.value = event.message || '重新刮削失败';
                rescraping.value = false;
                es.close();
                return;
              }
              rescrapeMessage.value = event.message || rescrapeMessage.value;
              if (event.step === 'done') {
                rescraping.value = false;
                es.close();
                await load();
              }
            };
            es.onerror = () => {
              rescrapeError.value = true;
              rescrapeMessage.value = '连接中断';
              rescraping.value = false;
              es.close();
            };
          } catch (e) {
            rescrapeError.value = true;
            rescrapeMessage.value = e.message;
            rescraping.value = false;
          }
        }

        function startEdit() {
          const v = video.value;
          form.value = {
            title_zh: v.title_zh || '',
            title_jp: v.title_jp || '',
            release_date: v.release_date || '',
            duration: v.duration || '',
            maker: v.maker || '',
            publisher: v.publisher || '',
            series: v.series || '',
            score: v.score != null ? v.score : '',
            actors: [...(v.actors || [])],
            tags: [...(v.tags || [])],
            newActor: '',
            newTag: '',
          };
          saveError.value = '';
          editing.value = true;
        }

        function cancelEdit() { editing.value = false; }

        function removeActor(i) { form.value.actors.splice(i, 1); }

        function onActorInput() {
          clearTimeout(actorTimer);
          const q = form.value.newActor.trim();
          if (!q) { actorSuggestions.value = []; return; }
          actorTimer = setTimeout(async () => {
            const res = await apiFetch('/api/actors?q=' + encodeURIComponent(q));
            actorSuggestions.value = res || [];
          }, 200);
        }
        function closeActorDropdown() { setTimeout(() => { actorSuggestions.value = []; }, 150); }
        function pickActor(a) {
          if (!form.value.actors.find(x => x.name === a.name)) {
            form.value.actors.push({ name: a.name, name_zh: a.name_zh, avatar_path: a.avatar_path });
          }
          form.value.newActor = '';
          actorSuggestions.value = [];
        }
        function addActorFromInput() {
          const q = form.value.newActor.trim();
          if (!q) return;
          if (actorSuggestions.value.length) { pickActor(actorSuggestions.value[0]); return; }
          if (!form.value.actors.find(a => a.name === q || a.name_zh === q)) {
            form.value.actors.push({ name: q, name_zh: '' });
          }
          form.value.newActor = '';
        }

        function onSeriesInput() {
          pickedSeriesClusterId.value = null;
          clearTimeout(seriesTimer);
          const q = form.value.series.trim();
          if (!q) { seriesSuggestions.value = []; return; }
          seriesTimer = setTimeout(async () => {
            const res = await apiFetch('/api/series?q=' + encodeURIComponent(q));
            seriesSuggestions.value = res || [];
          }, 200);
        }
        function closeSeriesDropdown() { setTimeout(() => { seriesSuggestions.value = []; }, 150); }
        function pickSeries(s) {
          // s is {name, name_zh, cluster_id}
          form.value.series = s.name_zh || s.name;
          pickedSeriesClusterId.value = s.cluster_id || null;
          seriesSuggestions.value = [];
        }

        function removeTag(i) { form.value.tags.splice(i, 1); }
        async function onTagInput() {
          const q = form.value.newTag.trim().toLowerCase();
          if (!q) { tagSuggestions.value = []; return; }
          if (!allTags.value.length) allTags.value = await apiFetch('/api/tags/all') || [];
          const selected = new Set(form.value.tags.map(tag => tag.name));
          tagSuggestions.value = allTags.value
            .filter(tag => tag.name.toLowerCase().includes(q) && !selected.has(tag.name))
            .slice(0, 20);
        }
        function closeTagDropdown() { setTimeout(() => { tagSuggestions.value = []; }, 150); }
        function pickTag(tag) {
          if (!form.value.tags.find(item => item.name === tag.name)) {
            form.value.tags.push({ id: tag.id, name: tag.name });
          }
          form.value.newTag = '';
          tagSuggestions.value = [];
        }
        function addTag() {
          const name = form.value.newTag.trim();
          if (name && !form.value.tags.find(t => t.name === name)) {
            form.value.tags.push({ name });
          }
          form.value.newTag = '';
          tagSuggestions.value = [];
        }

        async function saveEdit() {
          saving.value = true;
          saveError.value = '';
          const f = form.value;
          const payload = {
            title_zh: f.title_zh,
            title_jp: f.title_jp,
            release_date: f.release_date,
            duration: f.duration,
            maker: f.maker,
            publisher: f.publisher,
            series: f.series,
            actors: f.actors.map(a => ({ name: a.name || '', name_zh: a.name_zh || '' })),
            tags: f.tags.map(t => t.name),
          };
          if (pickedSeriesClusterId.value) {
            payload.series_cluster_id = pickedSeriesClusterId.value;
          }
          if (f.score !== '' && f.score !== null) payload.score = parseFloat(f.score);
          try {
            const r = await fetch('/api/videos/' + route.params.code, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!r.ok) {
              const err = await r.json();
              saveError.value = err.error || '保存失败';
            } else {
              video.value = await r.json();
              editing.value = false;
            }
          } catch (e) {
            saveError.value = '网络错误';
          } finally {
            saving.value = false;
          }
        }

        const renamingPath = ref(null);
        const renameFields = ref({ code: '', actors: '', title: '' });

        function parseFilename(path) {
          const name = path.split('/').pop();
          const dot = name.lastIndexOf('.');
          const ext = dot > 0 ? name.slice(dot) : '';
          const segs = (dot > 0 ? name.slice(0, dot) : name).split('.');
          let part = '';
          if (segs.length && /^part\w+$/i.test(segs[segs.length - 1])) part = segs.pop();
          const code = segs.shift() || '';
          let title = '';
          if (segs.length && /^\[.*\]$/.test(segs[segs.length - 1])) {
            title = segs.pop().replace(/^\[|\]$/g, '');
          }
          return { code, actors: segs.join('.'), title, part, ext };
        }

        function startRename(f) {
          renamingPath.value = f.path;
          const parsed = parseFilename(f.path);
          renameFields.value = { code: parsed.code, actors: parsed.actors, title: parsed.title };
        }

        function cancelRename() { renamingPath.value = null; }

        async function submitRename(f) {
          const fields = renameFields.value;
          const actors = (fields.actors || '').split('.').map(s => s.trim()).filter(Boolean);
          const body = { part: f.part || null, code: fields.code, actors, title: fields.title };
          const res = await apiFetch('/api/videos/' + video.value.code + '/rename-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          renamingPath.value = null;
          const newCode = res.code || video.value.code;
          const canonicalRouteCode = baseVideoCode(newCode);
          if (canonicalRouteCode !== route.params.code) {
            router.replace('/video/' + encodeURIComponent(canonicalRouteCode));
          } else {
            video.value = res;
          }
        }

        watch(() => route.params.code, () => {
          rescraping.value = false;
          rescrapeMessage.value = '';
          rescrapeError.value = false;
          load();
        });
        onMounted(load);
        return {
          video, loading, meta, fileParts, selectedFileMeta,
          renamingPath, renameFields, startRename, cancelRename, submitRename,
          editing, saving, saveError, form,
          rescraping, rescrapeMessage, rescrapeError, startRescrape,
          editFields: EDIT_FIELDS,
          actorSuggestions, seriesSuggestions, tagSuggestions,
          startEdit, cancelEdit, saveEdit,

            if (!data) return;
            message.value = '已加入 ' + data.added + ' 部，重复跳过 ' + data.duplicates + ' 部' +
              (data.rejected.length ? '，不符合条件 ' + data.rejected.length + ' 部：' + data.rejected.slice(0,3).map(row=>row.code + ' ' + row.reason).join('；') : '');
            selectedCodes.value = []; rawCodes.value = '';
          });
        }
        async function bulkAction(action) {
          if (action === 'delete' && !window.confirm('从队列删除所选任务？执行历史和视频文件会保留。')) return;
          await perform(async () => {
            const data = await request('/api/ltx/queue/bulk',{codes:selectedCodes.value,action,priority:priority.value});
            if (!data) return;
            message.value = '已更新 ' + data.changed + ' 个任务'; selectedCodes.value = [];
          });
        }
        function runImmediate() {
          if (!selectedCodes.value.length) return addCodes(rawCodes.value.split(/[\s,，;；]+/).filter(Boolean),true);
          return view.value === 'queue' ? bulkAction('immediate') : addCodes([...selectedCodes.value],true);
        }
        async function workerAction(action) {
          await perform(async () => {
            await request('/api/worker/control',{action});
            message.value = {pause:'已请求暂停，当前任务完成后暂停',stop:'已请求停止，待执行任务保留',
              restart:'已请求重启，待执行任务保留',resume:'Worker 已启动 / 恢复'}[action];
          });
        }
        async function saveQuota() {
          await perform(async () => { quota.value = await request('/api/worker/quota',quotaDraft.value,'PATCH'); message.value='配额已保存'; });
        }
        async function checkLogin() {
          await perform(async () => {
            const data = await apiFetch('/api/ltx/login-status');
            if (!data) throw new Error('登录状态检查失败，请查看 worker 状态');
            loggedIn.value = data.logged_in;
          });
        }
        async function openLogin() {
          await perform(async () => { await request('/api/ltx/open-login',{}); loggedIn.value=false; message.value='JavDB 登录页已打开'; });
        }
        async function setDownloaded(row) {
          const desired = row.downloaded;
          try { await request('/api/ltx/results/' + encodeURIComponent(row.code) + '/downloaded',{downloaded:desired},'PATCH'); }
          catch (e) { row.downloaded=!desired; error.value=e.message; }
        }
        async function showHistory(row) {
          historyCode.value=row.code; history.value=[];
          try { history.value=await apiFetch('/api/ltx/queue/'+row.id+'/history') || []; }
          catch (e) { error.value=e.message; }
        }
        function historyLinks(item) { try { const result=JSON.parse(item.result_json || '[]'); return Array.isArray(result)?result:[]; } catch { return []; } }
        watch(view, () => { selectedCodes.value=[]; statusFilter.value=''; });
        onMounted(async () => {
          try { await Promise.all([loadRows(),poll()]); } catch (e) { error.value=e.message; loading.value=false; }
          if (!disposed) timer=setInterval(poll,2000);
        });
        Vue.onUnmounted(() => { disposed=true; clearInterval(timer); });
        return { candidates,tasks,view,loading,worker,control,task,quota,quotaDraft,working,error,message,loggedIn,
          query,actressQuery,prefixFilter,statusFilter,columnFilters,resetFilters,rawCodes,selectedCodes,priority,historyCode,history,statuses,
          actressOptions,prefixOptions,filteredRows,queuePositions,allSelected,someSelected,toggleVisible,statusLabel,stateLabel,
          formatTime,addCodes,bulkAction,runImmediate,workerAction,saveQuota,checkLogin,openLogin,setDownloaded,showHistory,historyLinks };
      }
    };

    const router = createRouter({
      history: createWebHashHistory(),
      scrollBehavior(to, from, savedPosition) {
        // Scroll is restored manually after data loads; only reset on new navigation
        if (!savedPosition && !_scrollMap.has(window.location.origin + window.location.pathname + '#' + to.fullPath)) {
          return { top: 0 };
        }
        return false;
      },
      routes: [
        { path: '/', component: DashboardView },
        { path: '/videos', component: HomeView },
        { path: '/search', component: SearchView },
        { path: '/video/:code', component: VideoDetail },
        { path: '/actor/:id', component: ActorView },
        { path: '/tag/:id', component: TagView },
        { path: '/tags', component: AllTagsView },
        { path: '/actors', component: AllActorsView },
        { path: '/series', component: AllSeriesView },
        { path: '/series-detail', component: SeriesDetailView },
        { path: '/prefixes', component: AllPrefixesView },
        { path: '/prefix/:code', component: PrefixDetailView },
        { path: '/recommend', component: RecommendView },
        { path: '/ltx-scrape', component: LtxScrapeView },
      ]
    });

    // ── App ───────────────────────────────────────────────────
    const App = {
      setup() {
        const router = VueRouter.useRouter();
        const route = VueRouter.useRoute();
        const searchQ = ref('');
        const composing = ref(false);

        function doSearch() {
          if (composing.value) return;
          const q = searchQ.value.trim();
          if (!q) return;
          router.push({ path: '/search', query: { q } });
        }

        watch(() => route.query.q, (v) => { if (v) searchQ.value = v; });

        return { searchQ, composing, doSearch };
      },
      template: `
    <div class="min-h-screen">
      <div class="sticky top-0 z-50">
        <!-- Navbar -->
        <header class="glass-nav px-4 py-3 flex items-center gap-4">
          <router-link to="/" class="text-indigo-400 font-bold text-lg tracking-tight flex-shrink-0">AVideo</router-link>
          <form @submit.prevent="doSearch" class="flex-1 max-w-xl">
            <input v-model="searchQ" type="text" placeholder="搜索番号、标题、片商…"
              @compositionstart="composing = true"
              @compositionend="composing = false"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-1.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
          </form>
        </header>
        <!-- Sub-nav -->
        <nav class="glass-subnav px-4 flex overflow-x-auto">
          <router-link to="/videos"    class="nav-tab">影片</router-link>
          <router-link to="/tags"     class="nav-tab">类别</router-link>
          <router-link to="/actors"   class="nav-tab">演员</router-link>
          <router-link to="/series"   class="nav-tab">系列</router-link>
          <router-link to="/prefixes" class="nav-tab">番号</router-link>
          <router-link to="/recommend" class="nav-tab">推荐</router-link>
          <router-link to="/ltx-scrape" class="nav-tab">LTX</router-link>
        </nav>
      </div>
      <!-- Page -->
      <main class="px-4 py-6 max-w-screen-2xl mx-auto">
        <transition name="fade" mode="out-in">
          <router-view :key="$route.path" />
        </transition>
      </main>
    </div>
  `
    };

    const app = createApp(App);
    app.directive('ltrim', {
      mounted(el) {
        el.addEventListener('input', () => {
          const trimmed = el.value.replace(/^\s+/, '');
          if (trimmed !== el.value) {
            el.value = trimmed;
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      }
    });
    app.use(router).mount('#app');
  </script>
</body>

</html>

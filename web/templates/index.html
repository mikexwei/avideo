<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVideo</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/admin.css" />
  <style>
    .scrape-progress-card {
      display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(130px, 24%);
      align-items: center; gap: 14px; padding: 12px;
      overflow-wrap: anywhere;
    }
    .scrape-progress-cover {
      display: grid; place-items: center; width: 64px; aspect-ratio: 3 / 4;
      background: var(--subtle); border-radius: 8px; color: var(--muted); font-size: var(--text-small);
    }
    .scrape-progress-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .scrape-progress-card progress { width: 100%; height: 8px; accent-color: var(--primary); }
    .scrape-progress-pill { display: inline-block; border-radius: 20px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
    @media (max-width: 600px) {
      .scrape-progress-card { grid-template-columns: 48px minmax(0, 1fr); gap: 9px 12px; }
      .scrape-progress-cover { width: 48px; }
      .scrape-progress-state { grid-column: 2; }
    }
    .subtitle-card { display: grid; grid-template-columns: minmax(110px, 18%) minmax(0, 1fr) 210px; gap: 12px; align-items: center; }
    @media (max-width: 650px) {
      .subtitle-card { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- ========== VideoCard ========== -->
  <script type="text/x-template" id="tpl-video-card">
  <router-link :to="'/video/' + encodeURIComponent(baseVideoCode(video.code))" class="video-card">
    <div class="film-art">
      <span class="art-fallback" aria-hidden="true">{{ video.code }}</span>
      <img v-if="video.cover_path" :src="'/static/' + video.cover_path" class="cover-img w-full" alt="" loading="lazy" decoding="async" @error="imgErr" />
      <span v-if="video.score" class="score-badge absolute top-2 right-2 text-white text-xs font-bold px-2 py-0.5 rounded">
        {{ Number(video.score).toFixed(1) }}
      </span>
    </div>
    <div class="film-caption">
      <div class="film-code">{{ video.code }}</div>
      <div class="video-card-title text-sm leading-snug text-gray-200">{{ video.title_zh || video.title_jp || '暂无标题' }}</div>
      <div v-if="video.release_date" class="text-xs text-gray-500 mt-1">{{ video.release_date }}</div>
    </div>
    <!-- Deleted overlay -->
    <div v-if="video.deleted" class="absolute inset-0 bg-black bg-opacity-60 flex items-center justify-center rounded-lg pointer-events-none">
      <span class="text-red-400 text-xs font-bold border border-red-400 px-2 py-0.5 rounded">已删除</span>
    </div>
  </router-link>
</script>

  <!-- ========== Pagination ========== -->
  <script type="text/x-template" id="tpl-pagination">
  <div class="flex flex-wrap items-center gap-2 justify-center mt-8" v-if="totalPages > 1">
    <button @click="$emit('change', page - 1)" :disabled="page <= 1"
      class="px-3 py-1 rounded bg-gray-800 disabled:opacity-30 hover:bg-gray-700 text-sm">«</button>
    <template v-for="p in pages" :key="p">
      <span v-if="p === '...'" class="text-gray-500 px-1">…</span>
      <button v-else @click="$emit('change', p)"
        :class="['px-3 py-1 rounded text-sm', p === page ? 'bg-indigo-600 text-white' : 'bg-gray-800 hover:bg-gray-700']">{{ p }}</button>
    </template>
    <button @click="$emit('change', page + 1)" :disabled="page >= totalPages"
      class="px-3 py-1 rounded bg-gray-800 disabled:opacity-30 hover:bg-gray-700 text-sm">»</button>
    <span class="text-gray-500 text-sm ml-2">{{ total }} 部</span>
  </div>
</script>

  <!-- ========== HomeView ========== -->
  <script type="text/x-template" id="tpl-home">
  <div>
    <header class="library-hero" :class="{ 'library-hero-compact': filterLabel || selectedTags.length || page > 1 }">
      <img v-if="!filterLabel && !selectedTags.length && page === 1 && items[0]?.cover_path" class="library-hero-art"
        :src="'/static/' + items[0].cover_path" alt="" decoding="async" @error="hideImage" />
      <div class="library-hero-content">
        <p class="section-kicker">AVIDEO / FILM LIBRARY</p>
        <h1>影片库</h1>
        <p v-if="!loading" class="library-count">{{ total.toLocaleString() }} 部影片</p>
        <div class="library-destinations">
          <router-link to="/recommend" class="ui-button ui-primary">探索推荐</router-link>
          <router-link to="/actors" class="ui-button">按演员浏览</router-link>
        </div>
      </div>
    </header>
    <div class="library-heading">
      <h2>浏览影片</h2>
      <div class="flex flex-wrap items-center gap-2">
        <button @click="openManualModal" class="ui-button">手动添加</button>
        <button @click="openBatchModal" class="ui-button">批量添加/替换</button>
        <button @click="openAddModal" class="ui-button ui-primary">+ 添加影片</button>
      </div>
    </div>
    <add-video-modal v-if="showAddModal" @close="closeAddModal" />
    <add-video-modal v-if="showManualModal" :initial-step="'manual-code'" @close="closeManualModal" />
    <batch-modal v-if="showBatchModal" @close="closeBatchModal" />
    <div v-if="loading" class="text-center py-20 text-gray-500">加载中…</div>
    <div v-else>
      <!-- Active filter banner -->
      <div v-if="filterLabel" class="flex items-center gap-3 mb-4">
        <span class="text-gray-300 text-sm font-medium">{{ filterLabel }}</span>
        <span class="text-gray-500 text-sm">{{ total }} 部</span>
        <button v-if="rescrapeFilterStatus" @click="openRescrape"
          class="px-2.5 py-1 text-xs rounded-lg bg-amber-700 hover:bg-amber-600 text-white font-medium">
          ↻ 重新刮削
        </button>
        <router-link to="/videos" class="ml-auto text-xs text-indigo-400 hover:text-indigo-300">× 清除筛选</router-link>
      </div>

      <!-- Rescrape progress modal -->
      <div v-if="showRescrape" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80"
        @click.self="!rescrapeRunning && closeRescrape">
        <div class="bg-gray-900 rounded-xl w-full max-w-2xl mx-4 shadow-2xl" style="max-height:90vh;overflow-y:auto">
          <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
            <span class="font-semibold text-white">↻ 重新刮削 — {{ rescrapeFilterStatus }}</span>
            <button @click="closeRescrape" :disabled="rescrapeRunning"
              class="ui-button ui-icon-button" aria-label="关闭窗口">✕</button>
          </div>
          <!-- Confirm step -->
          <div v-if="!rescrapeStarted" class="p-5 flex flex-col gap-4">
            <div class="text-sm text-gray-300">
              将对当前筛选的 <span class="text-amber-400 font-semibold">{{ total }}</span> 部影片重新刮削、翻译并重命名。提交后将在后台处理。
            </div>
            <div class="flex justify-end gap-3">
              <button @click="closeRescrape" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">取消</button>
              <button @click="startRescrape" class="px-4 py-2 text-sm rounded-lg bg-amber-600 hover:bg-amber-500 text-white">开始刮削</button>
            </div>
          </div>
          <div v-else class="p-5 space-y-3">
            <p :class="rescrapeFailed ? 'text-red-300' : 'text-gray-200'">{{ rescrapeSummary }}</p>
            <div class="flex flex-wrap justify-end gap-3">
              <router-link v-if="!rescrapeRunning && !rescrapeFailed" to="/scrape-progress" class="px-4 py-2 text-sm text-indigo-300">查看刮削进度</router-link>
              <button @click="closeRescrape" :disabled="rescrapeRunning" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white disabled:opacity-40">完成</button>
            </div>
          </div>
        </div>
      </div>
      <div class="site-card library-toolbar" aria-label="影片筛选与排序" role="group">
        <div class="flex items-center gap-2 flex-wrap">
          <button v-for="tag in filterTags" :key="tag" @click="toggleTag(tag)"
            class="tag-pill" :aria-pressed="selectedTags.includes(tag)">
            {{ tag }}
          </button>
        </div>
        <sort-bar :sort="sort" playback @change="changeSort" />
      </div>
      <div class="film-grid">
        <video-card v-for="v in items" :key="v.id" :video="v" />
      </div>
      <p v-if="!items.length" class="site-card p-5 text-gray-500">没有符合当前筛选条件的影片。</p>
      <pagination :page="page" :total="total" :limit="limit" @change="changePage" />
    </div>
  </div>
</script>

  <!-- ========== BatchModal ========== -->
  <script type="text/x-template" id="tpl-batch-modal">
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80" @click.self="!batchProcessing && $emit('close')">
    <div class="batch-upload bg-gray-900 rounded-xl w-full max-w-4xl mx-4 shadow-2xl"
      role="dialog" aria-modal="true" aria-labelledby="batch-upload-title"
      @keydown.tab="keepBatchFocus" @keydown.esc.stop="!batchProcessing && $emit('close')">
      <div class="batch-upload-bar flex items-center justify-between gap-2 border-b border-gray-800">
        <h2 id="batch-upload-title" ref="batchTitle" tabindex="-1">批量添加 / 替换</h2>
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-500" v-if="batchStep !== 'batch-progress' || batchProcessing">
            步骤 {{ batchStepNum }} / 3
          </span>
          <button @click="$emit('close')" :disabled="batchProcessing"
            class="ui-button ui-icon-button" aria-label="关闭窗口">✕</button>
        </div>
      </div>

      <!-- Step 1: batch-select -->
      <template v-if="batchStep === 'batch-select'">
        <div class="batch-upload-body flex flex-col gap-4">
          <div>
            <h3 class="font-semibold mb-2">选择视频文件</h3>
            <div class="flex flex-col gap-2">
              <div v-if="batchFiles.length" class="flex flex-col gap-1">
                <div v-for="(f, i) in batchFiles" :key="f.name"
                  class="flex items-center gap-2 px-3 py-1.5 bg-gray-800 rounded text-sm">
                  <span class="batch-upload-filename flex-1 min-w-0">{{ f.name }}</span>
                  <button class="ui-button" :aria-label="'移除 ' + f.name" @click="batchFiles.splice(i, 1); $refs.batchFilePicker.focus()">移除</button>
                </div>
              </div>
              <button ref="batchFilePicker" @click="$refs.batchFileInput.click()"
                class="upload-picker text-sm text-gray-300">
                {{ batchFiles.length ? '+ 添加更多文件' : '点击选择视频文件…' }}
              </button>
              <input ref="batchFileInput" type="file" class="hidden" multiple
                accept=".mp4,.mkv,.avi,.mov,.wmv,.m4v,.ts,.flv,.webm"
                @change="onBatchFilesChange" />
            </div>
          </div>
          <div v-if="batchCheckError" class="text-sm text-red-400 px-3 py-2 bg-red-900 bg-opacity-20 rounded-lg">
            {{ batchCheckError }}
          </div>
        </div>
        <div class="batch-upload-bar flex justify-end gap-2 border-t border-gray-800">
          <button @click="$emit('close')"
            class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">取消</button>
          <button @click="runBatchCheck" :disabled="!batchFiles.length || batchChecking"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            <span v-if="batchChecking">检测中…</span>
            <span v-else>检测并确认</span>
          </button>
        </div>
      </template>

      <!-- Step 2: batch-review -->
      <template v-if="batchStep === 'batch-review'">
        <div class="batch-upload-body flex flex-col gap-4">
          <div class="text-sm text-gray-400">
            检测到 {{ batchGroups.length }} 个番号 —
            <span class="text-green-400">{{ batchGroups.filter(g => !g.exists && !g.warning).length }} 新增</span>，
            <span class="text-yellow-400">{{ batchGroups.filter(g => g.exists && !g.warning).length }} 替换</span>
            <span v-if="hasWarnings" class="text-yellow-400">
              ，{{ batchGroups.filter(g => g.warning).length }} 需要处理
            </span>
          </div>

          <ul class="batch-review-list" aria-label="待上传影片">
            <li v-for="g in batchGroups" :key="g.code || g.files[0].filename"
              class="batch-review-card" :class="{ 'border-amber-900': g.warning }">
              <div class="batch-review-file">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="batch-review-code">{{ g.code || '番号未识别' }}</h3>
                  <span class="batch-review-badge" :class="g.warning || g.exists ? 'bg-yellow-900 text-yellow-400' : 'bg-green-900 text-green-400'">
                    {{ g.warning ? '需要处理' : g.exists ? '替换' : '新增' }}
                  </span>
                  <span v-if="g.files.length > 1" class="text-xs text-gray-400">{{ g.files.length }} 个文件</span>
                </div>
                <ul class="mt-2">
                  <li v-for="f in g.files" :key="f.filename" class="batch-upload-filename">{{ f.filename }}</li>
                </ul>
                <dl v-if="g.exists && !g.warning" class="batch-review-destination">
                  <div v-if="g.original_path">
                    <dt>当前文件</dt><dd>{{ g.original_path }}</dd>
                  </div>
                  <div>
                    <dt>替换后的文件名</dt>
                    <dd v-for="name in g.finalNames" :key="name">{{ name }}</dd>
                    <dd v-if="!g.finalNames?.length">{{ g.previewError || '计算中…' }}</dd>
                  </div>
                </dl>
              </div>
              <p v-if="g.warning" class="batch-review-settings text-yellow-400 text-sm">{{ g.warning }}</p>
              <div v-else class="batch-review-settings">
                <div role="group" aria-label="字幕" class="batch-review-options">
                  <span class="batch-review-label">字幕</span>
                  <div class="flex flex-wrap gap-2">
                    <button v-for="[value, label] in [['','无中文'],['机翻中文','机翻中文'],['中文字幕','中文字幕']]"
                      :key="label" @click="g.subtitle_classification = value"
                      class="tag-pill" :aria-pressed="g.subtitle_classification === value">
                      {{ label }}
                    </button>
                  </div>
                </div>
                <div role="group" aria-label="破解标签" class="batch-review-options">
                  <span class="batch-review-label">破解标签</span>
                  <div class="flex flex-wrap gap-2">
                    <button @click="g.uncensored_crack_tag = ''" class="tag-pill" :aria-pressed="!g.uncensored_crack_tag">
                      未标记
                    </button>
                    <button v-for="tag in ['JAV 无码破解','LADA 无码破解','LTX 无码破解']" :key="tag"
                      @click="g.uncensored_crack_tag = tag" class="tag-pill" :aria-pressed="g.uncensored_crack_tag === tag">
                      {{ tag.replace(' 无码破解', '') }}
                    </button>
                  </div>
                </div>
                <label v-if="g.exists" class="batch-native-check">
                  <input type="checkbox" v-model="g.uncensored_native">
                  原装无码
                </label>
              </div>
            </li>
          </ul>

          <!-- Volume picker — only for new files -->
          <fieldset v-if="hasNewGroups" class="min-w-0">
            <legend class="font-semibold mb-2">新增文件存放位置</legend>
            <div class="flex flex-col gap-2">
              <label v-for="v in mediaLibraries" :key="v.path"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg border cursor-pointer transition-colors"
                :class="batchVolume === v.path ? 'border-indigo-500 bg-indigo-950' : 'border-gray-700 bg-gray-800 hover:border-gray-600'">
                <input type="radio" :value="v.path" v-model="batchVolume" class="accent-indigo-500" />
                <span class="flex-1 min-w-0 text-sm text-gray-200 break-all">{{ v.path }}</span>
                <span v-if="v.free_gb !== null" class="text-xs flex-shrink-0"
                  :class="v.free_gb < 10 ? 'text-red-400' : 'text-gray-400'">
                  {{ v.free_gb }} GB 可用
                </span>
              </label>
            </div>
          </fieldset>
          <p v-else-if="!hasWarnings" class="text-sm text-gray-400">替换文件将保存在原视频所在目录。</p>
        </div>
        <div class="batch-upload-bar flex flex-wrap items-center justify-end gap-2 border-t border-gray-800">
          <p v-if="hasWarnings" class="batch-upload-hint text-sm text-yellow-400">请返回移除有问题的文件，或改名后重新选择。</p>
          <p v-else-if="hasNewGroups && !batchVolume" class="batch-upload-hint text-sm text-gray-400">请选择新增文件的存放位置。</p>
          <button @click="batchStep = 'batch-select'"
            class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">返回选文件</button>
          <button @click="startBatchProcess" :disabled="!canStartUpload"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            开始上传
          </button>
        </div>
      </template>

      <!-- Step 3: batch-progress -->
      <template v-if="batchStep === 'batch-progress'">
        <div class="batch-upload-body flex flex-col gap-3">
          <div v-for="(r, i) in batchResults" :key="r.code || i"
            :class="['rounded-lg p-3 transition-colors', r.status === 'running' ? 'border border-indigo-600 bg-indigo-950 bg-opacity-50' : 'bg-gray-800']">
            <!-- Row header -->
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-indigo-400 text-xs">{{ r.code }}</span>
              <span :class="['text-xs px-1.5 py-0.5 rounded font-bold',
                r.type === 'new' ? 'bg-green-900 bg-opacity-40 text-green-400' : 'bg-yellow-900 bg-opacity-40 text-yellow-400']">
                {{ r.type === 'new' ? '新增' : '替换' }}
              </span>
              <span class="ml-auto text-xs" :class="{
                'text-gray-500': r.status === 'pending',
                'text-indigo-300': r.status === 'running',
                'text-green-400': r.status === 'done',
                'text-red-400': r.status === 'error',
              }">
                {{ {pending:'等待中', running:'处理中…', done:'✓ 完成', error:'✕ 失败'}[r.status] }}
              </span>
            </div>
            <!-- Replace: message + progress bar -->
            <div v-if="r.type === 'replace' && r.status !== 'error'" class="mt-1.5">
              <div v-if="r.message" class="text-xs text-gray-400 mb-1">{{ r.message }}</div>
              <div v-if="r.status === 'running'" class="flex items-center gap-2">
                <div class="flex-1 bg-gray-700 rounded-full h-2 overflow-hidden">
                  <div class="bg-indigo-500 h-2 rounded-full transition-all duration-200"
                    :style="{ width: (r.progress || 0) + '%' }"></div>
                </div>
                <span v-if="r.speed" class="text-xs text-gray-500 font-mono whitespace-nowrap">{{ r.speed }}</span>
                <span class="text-xs text-gray-400 font-mono w-9 text-right">{{ r.progress || 0 }}%</span>
              </div>
            </div>
            <!-- New: upload progress bar (before pipeline starts) -->
            <div v-if="r.type === 'new' && r.status === 'running'" class="mt-1.5">
              <div class="text-xs text-gray-400 mb-1">{{ r.progress >= 100 ? '正在提交入库…' : '上传中…' }}</div>
              <div class="flex items-center gap-2">
                <div class="flex-1 bg-gray-700 rounded-full h-2 overflow-hidden">
                  <div class="bg-indigo-500 h-2 rounded-full transition-all duration-200"
                    :style="{ width: (r.progress || 0) + '%' }"></div>
                </div>
                <span v-if="r.speed" class="text-xs text-gray-500 font-mono whitespace-nowrap">{{ r.speed }}</span>
                <span class="text-xs text-gray-400 font-mono w-9 text-right">{{ r.progress || 0 }}%</span>
              </div>
            </div>
            <div v-if="r.message && (r.type === 'new' || r.status === 'error')" class="text-xs mt-1"
              :class="r.status === 'error' ? 'text-red-400' : 'text-gray-400'">{{ r.message }}</div>
            <!-- View detail button -->
            <div v-if="r.status === 'done' && r.viewCode" class="mt-2">
              <a :href="'#/video/' + encodeURIComponent(r.viewCode)" target="_blank" rel="noopener"
                class="inline-flex items-center gap-1 px-2.5 py-1 text-xs rounded bg-indigo-700 hover:bg-indigo-600 text-white">
                查看详情 ↗
              </a>
            </div>
          </div>
          <div class="text-xs text-gray-600 text-center pt-1">
            {{ batchResults.filter(r => r.status === 'done' || r.status === 'error').length }}
            / {{ batchResults.length }} 已处理
          </div>
        </div>
        <div class="batch-upload-bar flex flex-wrap items-center justify-end gap-2 border-t border-gray-800">
          <router-link v-if="!batchProcessing && batchResults.some(r => r.type === 'new' && r.status === 'done')" to="/scrape-progress"
            class="px-4 py-2 text-sm text-indigo-300">查看刮削进度</router-link>
          <button @click="$emit('close')" :disabled="batchProcessing"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            完成
          </button>
        </div>
      </template>

    </div>
  </div>
  </script>

  <!-- ========== AddVideoModal ========== -->
  <script type="text/x-template" id="tpl-add-video">
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80" @click.self="(addStep !== 'auto-progress' || autoFinished) && $emit('close')">
    <div class="bg-gray-900 rounded-xl w-full max-w-lg mx-4 shadow-2xl" style="max-height:90vh;overflow-y:auto">

      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
        <h2>添加影片</h2>
        <button @click="$emit('close')" :disabled="addStep === 'auto-progress' && !autoFinished"
          class="ui-button ui-icon-button" aria-label="关闭窗口">✕</button>
      </div>

      <!-- ── Step: file-select ── -->
      <template v-if="addStep === 'file-select'">
        <div class="p-5 flex flex-col gap-4">
          <div>

          <select id="series-report" v-model="reportId" @change="loadReport" class="min-w-0 max-w-full">
            <option value="">选择报告</option>
            <option v-for="item in reports" :key="item.id" :value="item.id">
              第 {{ item.round || 1 }} 轮 · {{ formatDate(item.created_at) }} · {{ reportStatus(item) }}
            </option>
          </select>
          <button @click="refresh" :disabled="busy">刷新</button>
        </div>
        <p class="hint" role="status">{{ message }}</p>
        <p v-if="error" class="record-error" role="alert">{{ error }}</p>
      </div>

      <template v-if="report?.result">
        <div v-if="report.published_at" class="card mt-4">
          <h2>已发布</h2>
          <p class="hint">本报告已发布 {{ report.published_groups.length }} 组。继续调整时请生成新报告。</p>
          <table class="series-review-table mt-3" aria-label="已发布的系列">
            <thead><tr><th scope="col">最终名称</th><th scope="col">成员</th></tr></thead>
            <tbody>
              <tr v-for="(group, i) in report.published_groups" :key="i">
                <th scope="row">{{ group.name }}</th>
                <td>
                  <ul class="series-member-list">
                    <li v-for="unit in unitsFor(group.member_ids)" :key="unit.key">
                      <strong>{{ unit.name }}</strong>
                      <small v-if="unit.raw" class="series-raw-name">原文：{{ unit.raw }}</small>
                    </li>
                  </ul>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p v-else-if="report.result.version !== 3" class="card mt-4">此报告使用旧的系列规则，请重新生成报告。</p>
        <template v-else>
          <div class="library-heading mt-6">
            <div><h2>聚合候选</h2><p class="hint">第 {{ report.result.round || 1 }} 轮 · {{ reviewUnits.length }} 个比较对象 · {{ report.result.groups.length }} 组模型候选</p></div>
            <div class="flex flex-wrap gap-2">
              <button v-if="reviewUnits.length > 1 || reviewUnits.some(unit => unit.finalIds.length)" @click="addGroup">手工新建组</button>
              <button @click="nextRound" :disabled="busy || hasActive || !publishGroups.length || conflictingTargets">用已选草稿生成下一轮</button>
              <button class="primary" @click="publish" :disabled="busy || !publishGroups.length || conflictingTargets">发布审核结果（{{ publishGroups.length }} 组）</button>
            </div>
          </div>
          <section v-if="reviewUnits.length" class="card mb-4" aria-label="本轮比较对象">
            <h3>本轮比较对象</h3>
            <ul class="flex flex-wrap gap-2 mt-2">
              <li v-for="unit in reviewUnits.slice(0, unitLimit)" :key="unit.key" class="tag-pill break-all">{{ unit.name }}</li>
            </ul>
            <button v-if="unitLimit < reviewUnits.length" class="mt-2" @click="unitLimit += 30">查看更多比较对象</button>
          </section>
          <p v-if="report.result.groups.some(group => group.automatic)" class="hint mb-3">相似度大于 0.95 的候选已自动加入草稿，可以取消勾选。</p>
          <section v-if="mergedGroups.length" class="card mb-4" aria-label="合并预览">
            <h3>合并预览</h3>
            <p class="hint">含有共同成员的已选候选会发布为一组。取消某条候选可以调整合并范围。</p>
            <div v-for="group in mergedGroups" :key="group.first.key" class="series-review-fields mt-3">
              <label>合并后的最终名称 <input v-model.trim="group.first.name" maxlength="300"></label>
              <div>
                <p>{{ unitsFor(group.ids).map(unit => unit.name).join('、') }}</p>
                <p v-if="group.targets.size > 1" class="record-error" role="status">选中了不同的发布目标，请在下方候选中只保留一个。</p>
                <p v-else-if="group.targets.size" class="hint">发布到 {{ finalNames[[...group.targets][0]] }}</p>
              </div>
            </div>
          </section>
          <p v-if="!candidateDrafts.length" class="card">
            {{ reviewUnits.length === 0
              ? '暂无可用于比较的已翻译系列。新刮到的系列名翻译完成后，可以重新生成报告。'

                ? (publishGroups.length ? '本轮只有一个比较对象，可以直接发布审核结果。' : '本轮只有一个比较对象。至少需要两个系列才能比较。')
                : '本轮暂无模型候选。可以手工建立审核组。' }}
          </p>
          <div v-else class="card series-review-table-wrap">
            <table class="series-review-table" aria-label="系列聚合候选">
              <colgroup><col class="series-check-col"><col class="series-name-col"><col class="series-score-col"><col></colgroup>
              <thead>
                <tr><th scope="col">选择</th><th scope="col">建议最终名</th><th scope="col">相似度</th><th scope="col">比较对象</th></tr>
              </thead>
              <tbody v-for="group in candidateDrafts.slice(0, visible)" :key="group.key">
                <tr :class="{ 'series-group-selected': group.accept }">
                  <td><label class="series-group-check">
                    <input type="checkbox" v-model="group.accept" :aria-label="'选择 ' + (group.name || '手工审核组')">
                  </label></td>
                  <th scope="row">{{ group.name || '手工审核组' }}
                    <small v-if="group.automatic" class="series-raw-name">已自动加入草稿</small>
                  </th>
                  <td class="series-score">{{ group.score == null ? '—' : group.score.toFixed(4) }}</td>
                  <td>
                    <ul class="series-member-list">
                      <li v-for="unit in unitsFor(group.ids)" :key="unit.key" class="series-member">
                        <div class="min-w-0">
                          <strong>{{ unit.name }}</strong>
                          <small v-if="unit.raw" class="series-raw-name">原文：{{ unit.raw }}</small>
                          <p v-if="unit.sample" class="hint">{{ unit.films }} 部 ·
                            <router-link :to="'/video/' + encodeURIComponent(unit.sample)" class="text-indigo-300">{{ unit.sample }}</router-link>
                            <span v-if="unit.finalName"> · 已归入 {{ unit.finalName }}</span>
                          </p>
                        </div>
                        <button v-if="group.accept" @click="removeUnit(group, unit)" :aria-label="'移除 ' + unit.name">移除</button>
                      </li>
                    </ul>
                  </td>
                </tr>
                <tr v-if="group.accept" class="series-review-edit">
                  <td colspan="4">
                    <div class="series-review-fields">
                      <label v-if="!mergedGroups.some(merged => group.ids.some(id => merged.ids.has(id)))">
                        最终名称 <input v-model.trim="group.name" maxlength="300">
                      </label>
                      <label>发布到
                        <select v-model="group.finalId">
                          <option :value="null">新建最终系列</option>
                          <option v-for="id in existingGroups(group)" :key="id" :value="id">{{ finalNames[id] }}</option>
                        </select>
                      </label>
                      <label>搜索可添加的成员 <input v-model.trim="group.query" :placeholder="report.result.units ? '本轮比较名称' : '原名、译名或番号'"></label>
                      <label v-if="group.query">匹配的成员
                        <select :value="''" @change="addMember(group, $event)">
                          <option value="">选择后加入此组</option>
                          <option v-for="unit in availableMembers(group)" :key="unit.key" :value="unit.key">
                            {{ unit.name }}{{ unit.sample ? ' · ' + unit.sample : '' }}
                          </option>
                        </select>
                      </label>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <button class="mt-4" v-if="visible < candidateDrafts.length" @click="visible += 30">查看更多候选</button>
          <div v-if="publishGroups.length" class="mt-4 flex flex-wrap gap-2">
            <button @click="nextRound" :disabled="busy || hasActive || conflictingTargets">用已选草稿生成下一轮</button>
            <button class="primary" @click="publish" :disabled="busy || conflictingTargets">发布审核结果（{{ publishGroups.length }} 组）</button>
          </div>
        </template>
      </template>
    </section>
  </script>

              <div class="flex justify-between text-xs mb-1">
                <span class="text-indigo-400 group-hover:text-indigo-300 transition">{{ cov.label }}</span>
                <span class="text-gray-400">{{ cov.value }} / {{ stats.total_videos }} ({{ Math.round(cov.value / stats.total_videos * 100) }}%)</span>
              </div>
              <div class="w-full bg-gray-700 rounded-full h-3 overflow-hidden">
                <div class="h-3 rounded-full" :style="{ width: (cov.value / stats.total_videos * 100) + '%', background: cov.hex }"></div>
              </div>
            </router-link>
          </div>
          <!-- Scrape status -->
          <h2 class="text-sm font-semibold text-gray-300 mt-6 mb-3">刮削状态</h2>
          <div class="flex flex-wrap gap-2">
            <router-link v-for="(cnt, status) in stats.scrape_status" :key="status"
              :to="{ path: '/videos', query: { scrape_status: status } }"
              class="px-2 py-1 rounded text-xs font-medium hover:opacity-80 transition"
              :class="status === 'SUCCESS' ? 'bg-green-900 text-green-300' : status === 'PENDING' ? 'bg-yellow-900 text-yellow-300' : 'bg-gray-700 text-gray-300'">
              {{ status }}: {{ cnt }}
            </router-link>
          </div>
        </div>
      </div>

      <!-- Row 3: Top actors + Top tags -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Top actors -->
        <div class="bg-gray-900 rounded-lg p-5">
          <h2 class="text-sm font-semibold text-gray-300 mb-4">Top 10 演员</h2>
          <div class="space-y-2">
            <router-link v-for="a in stats.top_actors" :key="a.id" :to="'/actor/' + a.id"
              class="flex items-center gap-3 hover:bg-gray-800 rounded px-2 py-1 transition">
              <img v-if="a.avatar_path" :src="'/static/' + a.avatar_path" class="w-8 h-8 rounded-full object-cover flex-shrink-0" @error="imgErr" />
              <span v-else class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs flex-shrink-0">?</span>
              <span class="flex-1 text-sm text-gray-200 truncate">{{ a.name }}</span>
              <span class="text-xs text-gray-400">{{ a.count }} 部</span>
            </router-link>
          </div>
        </div>

        <!-- Top tags -->
        <div class="bg-gray-900 rounded-lg p-5">
          <h2 class="text-sm font-semibold text-gray-300 mb-4">Top 15 类别</h2>
          <div class="flex flex-wrap gap-2">
            <router-link v-for="t in stats.top_tags" :key="t.id" :to="'/tag/' + t.id"
              class="tag-pill">
              <span>{{ t.name }}</span>
              <span class="tag-count">{{ t.count }}</span>
            </router-link>
          </div>
        </div>
      </div>
    </div>
  </div>
</script>

  <!-- ========== SearchView ========== -->

  <!-- ========== VideoDetail ========== -->
  <script type="text/x-template" id="tpl-video-detail">
  <div>
    <div v-if="loading" class="text-center py-20 text-gray-500">加载中…</div>
    <div v-else-if="!video" class="text-center py-20 text-gray-500">未找到该番号</div>
    <div v-else class="film-detail">
      <div class="film-detail-toolbar">
        <button @click="backToLibrary" class="ui-button">← 返回</button>
        <div class="flex flex-wrap gap-2">
          <template v-if="!editing">
            <button v-if="!video.deleted" @click="startRescrape" :disabled="rescraping"

              {{ rescraping ? '提交中…' : '重新刮削' }}
            </button>
            <button v-if="!video.deleted" @click="startEdit" class="px-3 py-1 text-sm rounded bg-gray-700 hover:bg-gray-600 text-gray-200">编辑</button>
            <button v-if="!video.deleted" @click="confirmDelete"
              class="px-3 py-1 text-sm rounded bg-red-800 hover:bg-red-700 text-white">删除</button>
          </template>
          <template v-else>
            <button @click="saveEdit" :disabled="saving"
              class="px-3 py-1 text-sm rounded bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50">
              {{ saving ? '保存中…' : '保存' }}
            </button>
            <button @click="cancelEdit" class="px-3 py-1 text-sm rounded bg-gray-700 hover:bg-gray-600 text-gray-200">取消</button>
          </template>
        </div>
      </div>

      <!-- Deleted banner -->
      <div v-if="video.deleted" class="mb-4 px-4 py-2 bg-red-900 bg-opacity-50 border border-red-700 rounded text-red-300 text-sm flex items-center gap-2">
        <span>⚠️</span><span>该视频文件已删除，数据库记录保留。</span>
      </div>
      <div v-if="rescrapeMessage" class="mb-4 px-4 py-2 rounded text-sm"
        :class="rescrapeError ? 'bg-red-900 bg-opacity-40 border border-red-800 text-red-300' : 'bg-gray-800 text-gray-300'">
        {{ rescrapeMessage }}
        <router-link v-if="!rescraping && !rescrapeError" to="/scrape-progress" class="ml-2 text-indigo-300">查看刮削进度</router-link>
      </div>

      <div class="film-detail-grid">
      <header class="film-detail-title">
        <p class="section-kicker">FILM DETAILS</p>
        <div class="flex items-center gap-3 mb-1">
          <!-- Code: click to edit -->
          <template v-if="!editingCode">
            <button class="film-code film-code-edit" @click="startEditCode" :aria-label="'修改番号 ' + video.code">{{ video.code }}</button>
          </template>
          <template v-else>
            <input v-ltrim v-model="codeDraft" @keydown.enter="saveCode" @keydown.esc="cancelEditCode"
              class="bg-gray-800 border border-indigo-500 rounded px-2 py-0.5 font-mono text-indigo-300 text-lg font-bold focus:outline-none w-40" />
            <button @click="saveCode" class="text-xs px-2 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white">保存</button>
            <button @click="cancelEditCode" class="text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-200">取消</button>
          </template>
          <span v-if="!editing && video.score" class="score-badge text-white text-sm font-bold px-2 py-0.5 rounded">{{ Number(video.score).toFixed(1) }}</span>
        </div>
        <h1>{{ video.title_zh || video.title_jp || video.code }}</h1>
        <p v-if="video.title_zh && video.title_jp" class="text-sm text-gray-500 mt-0.5">{{ video.title_jp }}</p>
      </header>
      <div class="film-detail-media">
        <div class="watch-stage">
          <video v-if="playing && canPlay" ref="player" :key="streamUrl()" :src="streamUrl()" controls playsinline autoplay preload="metadata"
            :aria-label="video.title_zh || video.title_jp || video.code" @error="playbackError = true">
            <track v-for="track in subtitleTracks" :key="track.url" kind="subtitles"
              :src="track.url" :srclang="track.language" :label="track.label"
              :data-subtitle-id="track.id" :default="selectedSubtitle === track.id">
          </video>
          <template v-else>
            <span class="art-fallback" aria-hidden="true">{{ video.code }}</span>
            <img v-if="coverSrc || video.cover_path" :src="coverSrc || ('/static/' + video.cover_path)" alt="" @error="imgErr" />
            <button v-if="canPlay" type="button" class="watch-trigger" @click="playVideo" aria-label="播放影片">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            </button>
          </template>
        </div>
        <p v-if="playbackError" role="status" class="playback-message">当前浏览器无法播放此文件。可以尝试打开直链，或复制链接到外部播放器。</p>
        <p v-if="subtitleStatus" role="status" class="playback-message">{{ subtitleStatus }}</p>
        <div class="watch-actions">
          <select v-if="fileParts.length > 1 && canPlay" v-model="selectedPart" aria-label="播放分集">
            <option value="">默认分集</option>
            <option v-for="f in fileParts" :key="f.part" :value="f.part || ''">{{ f.part || '完整' }}</option>
          </select>
          <select v-if="subtitleTracks.length" v-model="selectedSubtitle" aria-label="播放字幕">
            <option :value="null">关闭字幕</option>
            <option v-for="track in subtitleTracks" :key="track.id" :value="track.id">{{ track.label }}</option>
          </select>
          <button v-if="canPlay && !playing" @click="playVideo" class="ui-button ui-primary">播放</button>
          <a v-if="canPlay" :href="streamUrl()" target="_blank" rel="noopener" class="ui-button">打开直链</a>
          <button v-if="canPlay" @click="copyStreamUrl" class="ui-button">{{ copied ? '已复制' : '复制 URL' }}</button>
          <button v-if="!video.deleted" @click="openReplaceModal" class="ui-button">替换视频</button>
          <button v-if="!video.deleted" @click="triggerCoverUpload" :disabled="coverUploading" class="ui-button">{{ coverUploading ? '上传中…' : '更换封面' }}</button>
          <input ref="coverFileInput" type="file" accept="image/*" class="hidden" @change="uploadCover" />
        </div>
      </div>
      <details v-if="canPlay" class="site-card p-4" @toggle="showPlaybackHistory">
        <summary class="cursor-pointer font-semibold">播放记录</summary>
        <p v-if="playbackHistory" class="text-sm text-gray-400 mt-2">
          {{ playbackHistory.play_count }} 次 · 累计 {{ playbackDuration(playbackHistory.watched_ms) }}
          <span v-if="playbackHistory.last_played_at"> · 最近 {{ new Date(playbackHistory.last_played_at).toLocaleString() }}</span>
        </p>
        <ul v-if="playbackHistory?.sessions.length" class="space-y-2 mt-3 text-sm">
          <li v-for="session in playbackHistory.sessions" :key="session.id">
            {{ new Date(session.started_at).toLocaleString() }} · {{ playbackDuration(session.watched_ms) }}
            <span v-if="session.part"> · {{ session.part }}</span>
            <span v-if="session.source === 'iina'"> · IINA</span>
          </li>
        </ul>
        <p v-if="playbackHistoryError" class="text-sm text-red-400 mt-2" role="status">{{ playbackHistoryError }}</p>
      </details>
      <div class="film-detail-info">
          <!-- View mode -->
          <template v-if="!editing">
            <h2>影片资料</h2>
            <dl class="film-metadata">
              <template v-for="row in meta" :key="row.label">
                <dt class="text-gray-500">{{ row.label }}</dt>
                <dd>
                  <router-link v-if="row.link" :to="row.link"
                    class="text-indigo-400 hover:text-indigo-300 hover:underline">{{ row.val }}</router-link>
                  <span v-else class="text-gray-200">{{ row.val }}</span>
                </dd>
              </template>
            </dl>
          </template>

          <!-- Edit mode -->
          <template v-else>
            <div class="grid grid-cols-1 gap-3 mb-4">
              <div v-for="f in editFields" :key="f.key" class="relative">
                <label class="block text-xs text-gray-500 mb-1">{{ f.label }}</label>
                <input v-ltrim v-model="form[f.key]" :type="f.type || 'text'" :step="f.step"
                  @input="f.key === 'series' ? onSeriesInput() : null"
                  @blur="f.key === 'series' ? closeSeriesDropdown() : null"
                  @focus="f.key === 'series' && form[f.key] ? onSeriesInput() : null"
                  class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
                <ul v-if="f.key === 'series' && seriesSuggestions.length"
                  class="absolute z-50 left-0 right-0 bg-gray-800 border border-gray-600 rounded mt-1 max-h-48 overflow-y-auto shadow-xl">
                  <li v-for="s in seriesSuggestions" :key="s.name"
                    @mousedown.prevent="pickSeries(s)"
                    class="px-3 py-2 text-sm text-gray-200 hover:bg-gray-700 cursor-pointer flex items-center gap-2">
                    <span>{{ s.name_zh || s.name }}</span>
                    <span v-if="s.name_zh" class="text-gray-500 text-xs truncate">{{ s.name }}</span>
                  </li>
                </ul>
              </div>
            </div>
            <p v-if="saveError" class="text-red-400 text-sm mb-3">{{ saveError }}</p>
          </template>

          <!-- Actors -->
          <div class="mb-3">
            <h2>演员</h2>
            <template v-if="!editing">
              <div class="flex flex-wrap gap-2">
                <router-link v-for="a in video.actors" :key="a.id" :to="'/actor/' + a.id"
                  class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 rounded-full px-2 py-1 text-sm transition">
                  <img v-if="a.avatar_path && a.avatar_path !== 'no_avatar'" :src="'/static/' + a.avatar_path" class="w-6 h-6 rounded-full object-cover" alt="" loading="lazy" @error="imgErr" />
                  <span class="w-6 h-6 rounded-full bg-gray-600 flex items-center justify-center text-xs" v-else>?</span>
                  <span>{{ a.name_zh || a.name }}</span>
                </router-link>
              </div>
            </template>
            <template v-else>
              <div class="flex flex-wrap gap-2 mb-2">
                <span v-for="(a, i) in form.actors" :key="a.name"
                  class="flex items-center gap-1 bg-gray-700 rounded-full px-2 py-1 text-sm">
                  {{ a.name_zh || a.name }}
                  <button @click="removeActor(i)" class="text-gray-400 hover:text-red-400 ml-1 leading-none">×</button>
                </span>
              </div>
              <div class="relative">
                <input v-ltrim v-model="form.newActor" @input="onActorInput" @blur="closeActorDropdown"
                  @keydown.enter.prevent="addActorFromInput"
                  placeholder="输入中文或日文演员名搜索…"
                  class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
                <ul v-if="actorSuggestions.length"
                  class="absolute z-50 left-0 right-0 bg-gray-800 border border-gray-600 rounded mt-1 max-h-48 overflow-y-auto shadow-xl">
                  <li v-for="a in actorSuggestions" :key="a.id"
                    @mousedown.prevent="pickActor(a)"
                    class="flex items-center gap-2 px-3 py-2 text-sm text-gray-200 hover:bg-gray-700 cursor-pointer">
                    <img v-if="a.avatar_path && a.avatar_path !== 'no_avatar'" :src="'/static/' + a.avatar_path" class="w-6 h-6 rounded-full object-cover" alt="" loading="lazy" @error="imgErr" />
                    <span class="w-6 h-6 rounded-full bg-gray-600 flex items-center justify-center text-xs flex-shrink-0" v-else>?</span>
                    <span>{{ a.name_zh || a.name }}</span>
                    <span v-if="a.name_zh" class="text-gray-500 text-xs">{{ a.name }}</span>
                  </li>
                </ul>
              </div>
            </template>
          </div>

          <!-- Tags -->
          <div class="mb-4">
            <h2>标签</h2>
            <template v-if="!editing">
              <div class="flex flex-wrap gap-2">
                <router-link v-for="t in video.tags" :key="t.id" :to="'/tag/' + t.id" class="tag-pill">{{ t.name }}</router-link>
              </div>
            </template>
            <template v-else>
              <div class="flex flex-wrap gap-2 mb-2">
                <span v-for="(t, i) in form.tags" :key="t.name"
                  class="tag-pill">
                  <span>{{ t.name }}</span>
                  <button @click="removeTag(i)" class="tag-remove" :aria-label="'移除标签 ' + t.name">×</button>
                </span>
              </div>
              <div class="relative flex gap-2">
                <div class="relative flex-1">
                  <input v-ltrim v-model="form.newTag" @input="onTagInput" @blur="closeTagDropdown"
                    @keydown.enter.prevent="addTag" placeholder="输入标签名搜索"
                    class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
                  <ul v-if="tagSuggestions.length"
                    class="absolute z-50 left-0 right-0 bg-gray-800 border border-gray-600 rounded mt-1 max-h-48 overflow-y-auto shadow-xl">
                    <li v-for="tag in tagSuggestions" :key="tag.id"
                      @mousedown.prevent="pickTag(tag)"
                      class="flex items-center justify-between px-3 py-2 text-sm text-gray-200 hover:bg-gray-700 cursor-pointer">
                      <span>{{ tag.name }}</span>
                      <span class="text-xs text-gray-500">{{ tag.count }}</span>
                    </li>
                  </ul>
                </div>
                <button @click="addTag" class="px-3 py-1 text-sm rounded bg-gray-700 hover:bg-gray-600">添加</button>
              </div>
            </template>
          </div>

          <!-- File paths -->
          <div v-if="fileParts.length" class="mt-2">
            <div class="text-gray-500 text-sm mb-1">本地文件</div>
            <div v-for="(f, i) in fileParts" :key="i"
              class="bg-gray-800 rounded px-3 py-2 mb-1">
              <div class="flex items-center justify-between gap-2 mb-0.5">
                <span v-if="f.part" class="text-xs text-indigo-400 font-mono flex-shrink-0">{{ f.part }}</span>
                <div class="flex items-center gap-1 ml-auto">
                  <button @click="startRename(f)"
                    class="text-xs flex-shrink-0 px-2 py-0.5 rounded transition bg-gray-700 hover:bg-gray-600 text-gray-300">
                    改名
                  </button>
                  <button @click="copyPath(f.path)"
                    class="text-xs flex-shrink-0 px-2 py-0.5 rounded transition"
                    :class="copiedPaths[f.path] ? 'bg-green-700 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'">
                    {{ copiedPaths[f.path] ? '已复制 ✓' : '复制' }}
                  </button>
                </div>
              </div>
              <span class="text-xs text-gray-400 font-mono break-all leading-relaxed">{{ f.path }}</span>
              <div class="mt-1 text-xs text-gray-600 flex flex-wrap gap-x-4 gap-y-1">
                <span v-if="f.file_size">{{ formatSize(f.file_size) }}</span>
                <span v-if="f.file_mtime">修改 {{ f.file_mtime.slice(0,10) }}</span>
                <span v-if="f.file_birthtime">创建 {{ f.file_birthtime.slice(0,10) }}</span>
              </div>

              <div v-if="renamingPath === f.path" class="mt-2 space-y-1.5 border-t border-gray-700 pt-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">番号</span>
                  <input v-model="renameFields.code" placeholder="ABP-119-UC"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">女优</span>
                  <input v-model="renameFields.actors" placeholder="多个用 . 分隔"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">标题</span>
                  <input v-model="renameFields.title" placeholder="标题（不含方括号）"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button @click="cancelRename"
                    class="text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300">取消</button>
                  <button @click="submitRename(f)"
                    class="text-xs px-2 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white">重命名</button>
                </div>
              </div>
            </div>
          </div>

          <!-- File meta -->
          <div v-if="selectedFileMeta.file_size" class="mt-2 text-xs text-gray-600 flex gap-4">
            <span>{{ selectedFileMeta.isTotal ? '总计 ' : '' }}{{ formatSize(selectedFileMeta.file_size) }}</span>
            <span v-if="selectedFileMeta.file_mtime">修改 {{ selectedFileMeta.file_mtime.slice(0,10) }}</span>
            <span v-if="selectedFileMeta.file_birthtime">创建 {{ selectedFileMeta.file_birthtime.slice(0,10) }}</span>
          </div>
        </div>
      </div>

      <!-- Replace Video Modal -->
      <teleport to="body">
        <div v-if="showReplaceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80" @click.self="closeReplaceModal">
          <div class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-md mx-4 shadow-2xl overflow-hidden">

            <!-- Header -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h2>替换视频</h2>
              </div>
              <button @click="closeReplaceModal" :disabled="replaceUploading"
                class="ui-button ui-icon-button" aria-label="关闭窗口">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Body -->
            <div class="px-5 py-4 space-y-4">

              <!-- Original part selector (multi-part videos only) -->
              <div v-if="fileParts.length > 1">
                <label class="block text-xs font-medium text-gray-400 mb-1.5">替换哪个 Part</label>
                <select v-model="replaceOriginalPart" :disabled="replaceUploading"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer disabled:opacity-50">
                  <option v-for="f in fileParts" :key="f.part || ''" :value="f.part || ''">{{ f.part || '完整' }}</option>

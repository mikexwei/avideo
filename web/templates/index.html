<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVideo</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    /* ── Apple Design System ── */

    /* SF Pro font stack — picks up system font on Apple devices, falls back gracefully */
    :root {
      --apple-display: "SF Pro Display", "SF Pro Icons", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --apple-text:    "SF Pro Text",    "SF Pro Icons", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --blue:   #0071e3;
      --blue-link-dark: #2997ff;
      --blue-link-light: #0066cc;
      --surface-1: #272729;
      --surface-2: #28282a;
      --surface-3: #2a2a2d;
      --text-primary: #f5f5f7;
      --text-secondary: rgba(255,255,255,.6);
      --text-tertiary: rgba(255,255,255,.4);
    }

    /* ── Background ── */
    body {
      background: #000;
      color: var(--text-primary);
      min-height: 100vh;
      font-family: var(--apple-text);
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.374px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Glass utility (kept for opt-in use) ── */
    .glass {
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    /* ── Navbar ── */
    header.glass-nav {
      background: rgba(0,0,0,.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    header.glass-nav .text-indigo-400 {
      color: #fff !important;
      font-family: var(--apple-display);
      font-size: 1.13rem;
      font-weight: 600;
      letter-spacing: -0.28px;
    }

    /* ── Sub-nav ── */
    nav.glass-subnav {
      background: rgba(0,0,0,.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    /* ── Cards ── */
    .card-hover {
      background: var(--surface-1);
      border: none;
      border-radius: 8px;
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: pointer;
    }

    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: rgba(0,0,0,.22) 3px 5px 30px 0px;
    }

    /* ── bg-gray-* overrides → Apple dark surfaces ── */
    .bg-gray-900 {
      background: var(--surface-1) !important;
    }
    .bg-gray-800 {
      background: var(--surface-2) !important;
    }
    .bg-gray-700 {
      background: var(--surface-3) !important;
    }
    .bg-gray-950 {
      background: transparent !important;
    }

    /* ── Inputs ── */
    input, select {
      background: var(--surface-2) !important;
      border-color: rgba(255,255,255,.12) !important;
      font-family: var(--apple-text);
      font-size: 15px;
      letter-spacing: -0.24px;
      color: #f5f5f7 !important;
    }
    input::placeholder { color: rgba(255,255,255,.32) !important; }
    input:focus, select:focus {
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 2px rgba(0,113,227,.25) !important;
      outline: none;
    }

    /* ── Cover image ── */
    .cover-img {
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--surface-2);
    }

    /* ── Tags ── */
    .tag-pill {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-family: var(--apple-text);
      letter-spacing: -0.12px;
      margin: 2px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      color: rgba(255,255,255,.7);
    }
    .tag-pill:hover {
      background: var(--surface-3);
      border-color: rgba(255,255,255,.18);
      color: #fff;
    }

    /* ── Score badge ── */
    .score-badge {
      background: var(--blue);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

    /* ── Page transitions ── */
    .fade-enter-active, .fade-leave-active { transition: opacity .15s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* ── Sub-nav tabs ── */
    .nav-tab {
      padding: 8px 16px;
      font-size: 14px;
      font-family: var(--apple-text);
      letter-spacing: -0.224px;
      color: rgba(255,255,255,.5);
      transition: color .15s;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .nav-tab:hover { color: rgba(255,255,255,.8); }
    .router-link-exact-active.nav-tab,
    .router-link-active.nav-tab {
      color: #fff;
      border-bottom-color: var(--blue);
    }

    /* ── Typography overrides ── */
    h1, h2, h3 {
      font-family: var(--apple-display);
      letter-spacing: -0.28px;
      line-height: 1.1;
    }
    .text-xl  { font-family: var(--apple-display); letter-spacing: -0.28px; }
    .text-2xl { font-family: var(--apple-display); letter-spacing: -0.28px; }
    .font-mono { font-family: "SF Mono", "Fira Mono", ui-monospace, monospace; }

    /* ── Indigo → Apple Blue remapping ── */
    .text-indigo-400 { color: var(--blue-link-dark) !important; }
    .text-indigo-300 { color: #5ac8fa !important; }
    .hover\:text-indigo-300:hover { color: #5ac8fa !important; }
    .bg-indigo-600  { background: var(--blue) !important; }
    .hover\:bg-indigo-500:hover { background: #0077ed !important; }
    .bg-indigo-500  { background: #0077ed !important; }
    .border-indigo-500 { border-color: var(--blue) !important; }
    .focus\:border-indigo-500:focus { border-color: var(--blue) !important; }
    .ring-indigo-500 { --tw-ring-color: var(--blue) !important; }
    /* Emerald bars keep their color — data viz distinction */

    /* ── Buttons ── */
    button, [role="button"] {
      font-family: var(--apple-text);
      letter-spacing: -0.224px;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    .ltx-column-filters th { padding: 0 12px 12px; vertical-align: top; font-weight: 400; }
    .ltx-column-filters input, .ltx-column-filters select {
      display: block; width: 100%; min-width: 0; height: 30px; padding: 4px 6px;
      border: 1px solid #374151; border-radius: 4px; background: #1f2937;
      color: #d1d5db; font-size: 12px; letter-spacing: 0;
    }
    .ltx-column-filters input:focus, .ltx-column-filters select:focus { outline: 1px solid #2997ff; }
    .ltx-column-filters th > * + * { margin-top: 4px; }
    .ltx-filter-range { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- ========== VideoCard ========== -->
  <script type="text/x-template" id="tpl-video-card">
  <div class="card-hover cursor-pointer rounded-lg overflow-hidden bg-gray-900 relative" @click="go">
    <div class="relative">
      <img v-if="video.cover_path" :src="'/static/' + video.cover_path" class="cover-img w-full" loading="lazy" @error="imgErr" />
      <div v-else class="cover-img w-full flex items-center justify-center text-gray-600 text-sm">无封面</div>
      <span v-if="video.score" class="score-badge absolute top-2 right-2 text-white text-xs font-bold px-2 py-0.5 rounded">
        {{ video.score.toFixed(1) }}
      </span>
    </div>
    <div class="p-2">
      <div class="text-xs text-indigo-400 font-mono mb-1">{{ video.code }}</div>
      <div class="text-sm leading-snug line-clamp-2 text-gray-200">{{ video.title_zh || video.title_jp || '暂无标题' }}</div>
      <div v-if="video.release_date" class="text-xs text-gray-500 mt-1">{{ video.release_date }}</div>
    </div>
    <!-- Deleted overlay -->
    <div v-if="video.deleted" class="absolute inset-0 bg-black bg-opacity-60 flex items-center justify-center rounded-lg pointer-events-none">
      <span class="text-red-400 text-xs font-bold border border-red-400 px-2 py-0.5 rounded">已删除</span>
    </div>
  </div>
</script>

  <!-- ========== Pagination ========== -->
  <script type="text/x-template" id="tpl-pagination">
  <div class="flex items-center gap-2 justify-center mt-8" v-if="totalPages > 1">
    <button @click="$emit('change', page - 1)" :disabled="page <= 1"
      class="px-3 py-1 rounded bg-gray-800 disabled:opacity-30 hover:bg-gray-700 text-sm">«</button>
    <template v-for="p in pages" :key="p">
      <span v-if="p === '...'" class="text-gray-500 px-1">…</span>
      <button v-else @click="$emit('change', p)"
        :class="['px-3 py-1 rounded text-sm', p === page ? 'bg-indigo-600 text-white' : 'bg-gray-800 hover:bg-gray-700']">{{ p }}</button>
    </template>
    <button @click="$emit('change', page + 1)" :disabled="page >= totalPages"
      class="px-3 py-1 rounded bg-gray-800 disabled:opacity-30 hover:bg-gray-700 text-sm">»</button>
    <span class="text-gray-500 text-sm ml-2">{{ total }} 部</span>
  </div>
</script>

  <!-- ========== HomeView ========== -->
  <script type="text/x-template" id="tpl-home">
  <div>
    <div v-if="loading" class="text-center py-20 text-gray-500">加载中…</div>
    <div v-else>
      <!-- Active filter banner -->
      <div v-if="filterLabel" class="flex items-center gap-3 mb-4">
        <span class="text-gray-300 text-sm font-medium">{{ filterLabel }}</span>
        <span class="text-gray-500 text-sm">{{ total }} 部</span>
        <button v-if="rescrapeFilterStatus" @click="openRescrape"
          class="px-2.5 py-1 text-xs rounded-lg bg-amber-700 hover:bg-amber-600 text-white font-medium">
          ↻ 重新刮削
        </button>
        <router-link to="/videos" class="ml-auto text-xs text-indigo-400 hover:text-indigo-300">× 清除筛选</router-link>
      </div>

      <!-- Rescrape progress modal -->
      <div v-if="showRescrape" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80"
        @click.self="!rescrapeRunning && closeRescrape">
        <div class="bg-gray-900 rounded-xl w-full max-w-2xl mx-4 shadow-2xl" style="max-height:90vh;overflow-y:auto">
          <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
            <span class="font-semibold text-white">↻ 重新刮削 — {{ rescrapeFilterStatus }}</span>
            <button @click="closeRescrape" :disabled="rescrapeRunning"
              class="text-gray-500 hover:text-gray-300 disabled:opacity-30 text-lg leading-none">✕</button>
          </div>
          <!-- Confirm step -->
          <div v-if="!rescrapeStarted" class="p-5 flex flex-col gap-4">
            <div class="text-sm text-gray-300">
              将对当前筛选的 <span class="text-amber-400 font-semibold">{{ total }}</span> 部影片重新刮削、翻译并重命名。该操作较慢，请耐心等待。
            </div>
            <div class="flex justify-end gap-3">
              <button @click="closeRescrape" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">取消</button>
              <button @click="startRescrape" class="px-4 py-2 text-sm rounded-lg bg-amber-600 hover:bg-amber-500 text-white">开始刮削</button>
            </div>
          </div>
          <!-- Progress step -->
          <div v-else class="p-5 flex flex-col gap-2" style="max-height:65vh;overflow-y:auto">
            <div v-for="r in rescrapeItems" :key="r.code"
              class="flex items-center gap-2 px-3 py-2 rounded-lg"
              :class="r.status === 'running' ? 'bg-indigo-950 bg-opacity-50 border border-indigo-700' : 'bg-gray-800'">
              <span class="font-mono text-indigo-400 text-xs flex-shrink-0 w-28 truncate">{{ r.code }}</span>
              <span class="flex-shrink-0 w-4 text-center">
                <span v-if="r.status === 'done'" class="text-green-500">✓</span>
                <span v-else-if="r.status === 'running'" class="text-indigo-400">⊙</span>
                <span v-else-if="r.status === 'error'" class="text-red-400">✕</span>
                <span v-else class="text-gray-700">○</span>
              </span>
              <span class="flex-1 text-xs truncate"
                :class="{'text-gray-500': r.status === 'pending', 'text-indigo-300': r.status === 'running', 'text-gray-400': r.status === 'done', 'text-red-400': r.status === 'error'}">
                {{ r.message || {pending:'等待中', running:'刮削中…'}[r.status] }}
              </span>
              <a v-if="r.status === 'done'" :href="'#/video/' + encodeURIComponent(r.code)" target="_blank" rel="noopener"
                class="flex-shrink-0 text-xs text-indigo-400 hover:text-indigo-300">查看 ↗</a>
            </div>
            <div class="text-xs text-gray-600 text-center pt-1">
              {{ rescrapeItems.filter(r => r.status === 'done' || r.status === 'error').length }} / {{ rescrapeItems.length }} 已处理
              <span v-if="rescrapeSummary" class="text-gray-400">— {{ rescrapeSummary }}</span>
            </div>
            <div class="flex justify-end pt-2">
              <button @click="closeRescrape" :disabled="rescrapeRunning"
                class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
                {{ rescrapeRunning ? '处理中…' : '完成' }}
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
        <div class="flex items-center gap-2 flex-wrap">
          <button v-for="tag in filterTags" :key="tag" @click="toggleTag(tag)"
            :class="['px-2.5 py-1 rounded text-xs transition', selectedTags.includes(tag) ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">
            {{ tag }}
          </button>
        </div>
        <div class="flex items-center gap-2">
          <sort-bar :sort="sort" @change="changeSort" />
          <button @click="openManualModal"
            class="px-3 py-1.5 text-sm rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium flex-shrink-0">
            手动添加
          </button>
          <button @click="openBatchModal"
            class="px-3 py-1.5 text-sm rounded-lg bg-indigo-700 hover:bg-indigo-600 text-white font-medium flex-shrink-0">
            ⚡ 批量添加/替换
          </button>
          <button @click="openAddModal"
            class="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium flex-shrink-0">
            + 添加影片
          </button>
        </div>
      </div>
      <add-video-modal v-if="showAddModal" @close="closeAddModal" />
      <add-video-modal v-if="showManualModal" :initial-step="'manual-code'" @close="closeManualModal" />
      <batch-modal v-if="showBatchModal" @close="closeBatchModal" />
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <video-card v-for="v in items" :key="v.id" :video="v" />
      </div>
      <pagination :page="page" :total="total" :limit="limit" @change="changePage" />
    </div>
  </div>
</script>

  <!-- ========== BatchModal ========== -->
  <script type="text/x-template" id="tpl-batch-modal">
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80" @click.self="!batchProcessing && $emit('close')">
    <div class="bg-gray-900 rounded-xl w-full max-w-4xl mx-4 shadow-2xl" style="max-height:90vh;overflow-y:auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
        <span class="font-semibold text-white">⚡ 批量添加/替换</span>
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-500" v-if="batchStep !== 'batch-progress' || batchProcessing">
            步骤 {{ batchStepNum }} / 3
          </span>
          <button @click="$emit('close')" :disabled="batchProcessing"
            class="text-gray-500 hover:text-gray-300 disabled:opacity-30 text-lg leading-none">✕</button>
        </div>
      </div>

      <!-- Step 1: batch-select -->
      <template v-if="batchStep === 'batch-select'">
        <div class="p-5 flex flex-col gap-4">
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-2">选择视频文件</div>
            <div class="flex flex-col gap-2">
              <div v-if="batchFiles.length" class="flex flex-col gap-1">
                <div v-for="(f, i) in batchFiles" :key="i"
                  class="flex items-center gap-2 px-3 py-1.5 bg-gray-800 rounded text-sm">
                  <span class="text-indigo-400 text-xs">🎬</span>
                  <span class="flex-1 truncate text-gray-300 font-mono text-xs">{{ f.name }}</span>
                </div>
              </div>
              <button @click="$refs.batchFileInput.click()"
                class="px-4 py-2.5 border border-dashed border-gray-700 rounded-lg text-sm text-gray-400 hover:border-gray-500 hover:text-gray-300 text-center transition-colors">
                {{ batchFiles.length ? '+ 添加更多文件' : '点击选择视频文件…' }}
              </button>
              <input ref="batchFileInput" type="file" class="hidden" multiple
                accept=".mp4,.mkv,.avi,.mov,.wmv,.m4v,.ts,.flv,.webm"
                @change="onBatchFilesChange" />
            </div>
          </div>
          <div v-if="batchCheckError" class="text-sm text-red-400 px-3 py-2 bg-red-900 bg-opacity-20 rounded-lg">
            {{ batchCheckError }}
          </div>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-gray-800">
          <button @click="$emit('close')"
            class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">取消</button>
          <button @click="runBatchCheck" :disabled="!batchFiles.length || batchChecking"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            <span v-if="batchChecking">检测中…</span>
            <span v-else>下一步 →</span>
          </button>
        </div>
      </template>

      <!-- Step 2: batch-review -->
      <template v-if="batchStep === 'batch-review'">
        <div class="p-5 flex flex-col gap-4">
          <div class="text-sm text-gray-400">
            检测到 {{ batchGroups.length }} 个番号 —
            <span class="text-green-400">{{ batchGroups.filter(g => !g.exists && !g.warning).length }} 新增</span>，
            <span class="text-yellow-400">{{ batchGroups.filter(g => g.exists && !g.warning).length }} 替换</span>
            <span v-if="batchGroups.filter(g => g.warning).length" class="text-orange-400">
              ，{{ batchGroups.filter(g => g.warning).length }} 需要处理
            </span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm border-collapse">
              <thead>
                <tr class="text-xs text-gray-500 uppercase tracking-wider border-b border-gray-800">
                  <th class="text-left py-2 px-2">番号</th>
                  <th class="text-left py-2 px-2">文件</th>
                  <th class="text-left py-2 px-2">操作</th>
                  <th class="text-left py-2 px-2">标签确认</th>
                  <th class="text-left py-2 px-2">目标文件名</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="g in batchGroups" :key="g.code || g.files[0].filename"
                  :class="['border-b border-gray-800', g.warning ? 'bg-orange-900 bg-opacity-10' : g.exists ? 'bg-yellow-900 bg-opacity-5' : '']">
                  <td class="py-2 px-2 font-mono text-indigo-400 text-xs whitespace-nowrap">{{ g.code || '?' }}</td>
                  <td class="py-2 px-2 align-top">
                    <div style="max-width:14rem">
                      <div v-for="f in g.files" :key="f.filename"
                        class="text-xs text-gray-400 truncate font-mono">{{ f.filename }}</div>
                      <div v-if="g.exists && g.original_path"
                        class="text-xs text-gray-600 truncate mt-0.5">→ {{ g.original_path }}</div>
                    </div>
                  </td>
                  <td class="py-2 px-2 whitespace-nowrap">
                    <span v-if="g.warning"
                      class="px-1.5 py-0.5 rounded text-xs font-bold bg-orange-900 bg-opacity-40 text-orange-400">⚠ 警告</span>
                    <template v-else-if="g.exists">
                      <span class="px-1.5 py-0.5 rounded text-xs font-bold bg-yellow-900 bg-opacity-40 text-yellow-400">替换</span>
                    </template>
                    <template v-else>
                      <span class="px-1.5 py-0.5 rounded text-xs font-bold bg-green-900 bg-opacity-40 text-green-400">新增</span>
                      <span v-if="g.files.length > 1"
                        class="ml-1 px-1.5 py-0.5 rounded text-xs font-bold bg-indigo-900 bg-opacity-40 text-indigo-400">
                        {{ g.files.length }} parts
                      </span>
                    </template>
                  </td>
                  <td class="py-2 px-2 whitespace-nowrap align-top">
                    <div v-if="g.warning" class="text-xs text-orange-400 max-w-xs leading-snug whitespace-normal">{{ g.warning }}</div>
                    <div v-else class="flex flex-col gap-1.5">
                      <label v-for="[key, label] in [['uncensored_native','原装无码']]"
                        :key="key" class="flex items-center gap-1.5 cursor-pointer">
                        <button @click="toggleGroupTag(g, key)"
                          class="w-7 h-4 rounded-full transition-colors flex-shrink-0 relative"
                          :class="g[key] ? 'bg-indigo-600' : 'bg-gray-700'">
                          <span class="absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all"
                            :class="g[key] ? 'left-3.5' : 'left-0.5'"></span>
                        </button>

              :style="{ width: addUploadPct + '%' }"></div>
          </div>
        </div>
        <div v-if="addError" class="mx-5 mb-1 px-3 py-2 bg-red-900 bg-opacity-40 rounded-lg text-red-300 text-xs">
          {{ addError }}
        </div>
        <div class="flex justify-between gap-3 px-5 py-4 border-t border-gray-800">
          <button v-if="initialStep !== 'manual-code'" @click="addStep = 'mode-select'" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">← 上一步</button>
          <button @click="startManualUpload" :disabled="manualUploading || !addFiles.length || !addVolume"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            {{ manualUploading ? '上传中…' : '上传 →' }}
          </button>
        </div>
      </template>

      <!-- ── Step: manual-meta ── -->
      <template v-if="addStep === 'manual-meta'">
        <div class="p-5 flex flex-col gap-4">
          <div class="text-xs text-indigo-400 font-mono">{{ manualCode }}</div>
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">原始标题（可选）</div>
            <input v-model="manualTitleJp" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-200" placeholder="日文/英文标题…" />
          </div>
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">中文标题（可选）</div>
            <input v-model="manualTitleZh" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-200" placeholder="中文标题…" />
          </div>
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">短标题（可选）</div>
            <input v-model="manualTitleShort" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-200" placeholder="简短标题…" />
          </div>
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">演员（逗号分隔，可选）</div>
            <input v-model="manualActors" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-200" placeholder="演员 A, 演员 B…" />
          </div>
          <div>
            <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">Tags</div>
            <div class="flex flex-wrap gap-2">
              <button v-for="tag in ['机翻中文','中文字幕','JAV 无码破解','LADA 无码破解','LTX 无码破解','无码流出','原装无码']" :key="tag"
                @click="toggleManualTag(tag)"
                :class="['px-2.5 py-1 rounded-full text-xs transition',
                  manualTags.includes(tag) ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700']">
                {{ tag }}
              </button>
            </div>
          </div>
          <div v-if="manualMetaError" class="text-red-400 text-xs">{{ manualMetaError }}</div>
        </div>
        <div class="flex justify-between gap-3 px-5 py-4 border-t border-gray-800">
          <button @click="addStep = 'done'; addDoneCode = manualCode"
            class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">
            跳过
          </button>
          <button @click="saveManualMeta" :disabled="manualSaving"
            class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-40">
            {{ manualSaving ? '保存中…' : '完成 ✓' }}
          </button>
        </div>
      </template>

      <!-- ── Step: done ── -->
      <template v-if="addStep === 'done'">
        <div class="p-8 text-center flex flex-col gap-3">
          <div class="text-4xl">✅</div>
          <div class="text-white font-semibold text-lg">入库完成</div>
          <div class="text-gray-500 text-sm font-mono">{{ addDoneCode }}</div>
        </div>
        <div class="flex justify-center gap-4 px-5 py-4 border-t border-gray-800">
          <button @click="$emit('close')" class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">关闭</button>
          <button @click="goToVideo(addDoneCode)" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">
            查看影片 →
          </button>
        </div>
      </template>

    </div>
  </div>
  </script>

          <template v-else>
            <button @click="saveEdit" :disabled="saving"

          </template>
          <template v-else>
            <input v-ltrim v-model="codeDraft" @keydown.enter="saveCode" @keydown.esc="cancelEditCode"
              class="bg-gray-800 border border-indigo-500 rounded px-2 py-0.5 font-mono text-indigo-300 text-lg font-bold focus:outline-none w-40" />

          <span v-if="!editing && video.score" class="score-badge text-white text-sm font-bold px-2 py-0.5 rounded">{{ Number(video.score).toFixed(1) }}</span>

            <div class="absolute inset-0 rounded-lg bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <span class="text-white text-sm">{{ coverUploading ? '上传中…' : '更换封面' }}</span>
            </div>

                  <router-link v-if="row.link" :to="row.link"

                  <span v-else class="text-gray-200">{{ row.val }}</span>

              </template>
            </dl>
          </template>

          <!-- Edit mode -->
          <template v-else>

                  @blur="f.key === 'series' ? closeSeriesDropdown() : null"
                  @focus="f.key === 'series' && form[f.key] ? onSeriesInput() : null"

                    @mousedown.prevent="pickSeries(s)"

                    <span v-if="s.name_zh" class="text-gray-500 text-xs truncate">{{ s.name }}</span>

                </ul>
              </div>
            </div>
            <p v-if="saveError" class="text-red-400 text-sm mb-3">{{ saveError }}</p>
          </template>

          <!-- Actors -->
          <div class="mb-3">
            <div class="text-gray-500 text-sm mb-1">演员</div>

                <ul v-if="actorSuggestions.length"
                  class="absolute z-50 left-0 right-0 bg-gray-800 border border-gray-600 rounded mt-1 max-h-48 overflow-y-auto shadow-xl">
                  <li v-for="a in actorSuggestions" :key="a.id"
                    @mousedown.prevent="pickActor(a)"
                    class="flex items-center gap-2 px-3 py-2 text-sm text-gray-200 hover:bg-gray-700 cursor-pointer">
                    <img v-if="a.avatar_path" :src="'/static/' + a.avatar_path" class="w-6 h-6 rounded-full object-cover" @error="imgErr" />
                    <span class="w-6 h-6 rounded-full bg-gray-600 flex items-center justify-center text-xs flex-shrink-0" v-else>?</span>
                    <span>{{ a.name_zh || a.name }}</span>
                    <span v-if="a.name_zh" class="text-gray-500 text-xs">{{ a.name }}</span>
                  </li>
                </ul>
              </div>
            </template>
          </div>

          <!-- Tags -->
          <div class="mb-4">
            <div class="text-gray-500 text-sm mb-1">标签</div>
            <template v-if="!editing">
              <div class="flex flex-wrap">
                <router-link v-for="t in video.tags" :key="t.id" :to="'/tag/' + t.id" class="tag-pill text-gray-300 hover:text-white">{{ t.name }}</router-link>
              </div>
            </template>
            <template v-else>
              <div class="flex flex-wrap gap-2 mb-2">
                <span v-for="(t, i) in form.tags" :key="t.name"

              </div>
              <div class="relative flex gap-2">

                  <ul v-if="tagSuggestions.length"

                    <li v-for="tag in tagSuggestions" :key="tag.id"
                      @mousedown.prevent="pickTag(tag)"
                      class="flex items-center justify-between px-3 py-2 text-sm text-gray-200 hover:bg-gray-700 cursor-pointer">
                      <span>{{ tag.name }}</span>
                      <span class="text-xs text-gray-500">{{ tag.count }}</span>

                  </ul>
                </div>
                <button @click="addTag" class="px-3 py-1 text-sm rounded bg-gray-700 hover:bg-gray-600">添加</button>
              </div>
            </template>
          </div>

          <!-- File paths -->
          <div v-if="fileParts.length" class="mt-2">
            <div class="text-gray-500 text-sm mb-1">本地文件</div>
            <div v-for="(f, i) in fileParts" :key="i"
              class="bg-gray-800 rounded px-3 py-2 mb-1">
              <div class="flex items-center justify-between gap-2 mb-0.5">
                <span v-if="f.part" class="text-xs text-indigo-400 font-mono flex-shrink-0">{{ f.part }}</span>
                <div class="flex items-center gap-1 ml-auto">
                  <button @click="startRename(f)"
                    class="text-xs flex-shrink-0 px-2 py-0.5 rounded transition bg-gray-700 hover:bg-gray-600 text-gray-300">
                    改名
                  </button>
                  <button @click="copyPath(f.path)"
                    class="text-xs flex-shrink-0 px-2 py-0.5 rounded transition"
                    :class="copiedPaths[f.path] ? 'bg-green-700 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'">
                    {{ copiedPaths[f.path] ? '已复制 ✓' : '复制' }}
                  </button>
                </div>
              </div>
              <span class="text-xs text-gray-400 font-mono break-all leading-relaxed">{{ f.path }}</span>
              <div class="mt-1 text-xs text-gray-600 flex flex-wrap gap-x-4 gap-y-1">
                <span v-if="f.file_size">{{ formatSize(f.file_size) }}</span>
                <span v-if="f.file_mtime">修改 {{ f.file_mtime.slice(0,10) }}</span>
                <span v-if="f.file_birthtime">创建 {{ f.file_birthtime.slice(0,10) }}</span>
              </div>

              <div v-if="renamingPath === f.path" class="mt-2 space-y-1.5 border-t border-gray-700 pt-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">番号</span>
                  <input v-model="renameFields.code" placeholder="ABP-119-UC"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">女优</span>
                  <input v-model="renameFields.actors" placeholder="多个用 . 分隔"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-10 flex-shrink-0">标题</span>
                  <input v-model="renameFields.title" placeholder="标题（不含方括号）"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-indigo-500" />
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button @click="cancelRename"
                    class="text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300">取消</button>
                  <button @click="submitRename(f)"
                    class="text-xs px-2 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white">重命名</button>
                </div>
              </div>
            </div>
          </div>

          <!-- File meta -->
          <div v-if="selectedFileMeta.file_size" class="mt-2 text-xs text-gray-600 flex gap-4">
            <span>{{ selectedFileMeta.isTotal ? '总计 ' : '' }}{{ formatSize(selectedFileMeta.file_size) }}</span>
            <span v-if="selectedFileMeta.file_mtime">修改 {{ selectedFileMeta.file_mtime.slice(0,10) }}</span>
            <span v-if="selectedFileMeta.file_birthtime">创建 {{ selectedFileMeta.file_birthtime.slice(0,10) }}</span>
          </div>
        </div>
      </div>

      <!-- Replace Video Modal -->
      <teleport to="body">
        <div v-if="showReplaceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80" @click.self="closeReplaceModal">
          <div class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-md mx-4 shadow-2xl overflow-hidden">

            <!-- Header -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h2 class="text-sm font-semibold text-gray-100 tracking-wide">替换视频</h2>
              </div>
              <button @click="closeReplaceModal" :disabled="replaceUploading"
                class="w-7 h-7 flex items-center justify-center rounded-md text-gray-500 hover:text-gray-200 hover:bg-gray-800 transition-colors cursor-pointer disabled:opacity-40">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Body -->
            <div class="px-5 py-4 space-y-4">

              <!-- Original part selector (multi-part videos only) -->
              <div v-if="fileParts.length > 1">
                <label class="block text-xs font-medium text-gray-400 mb-1.5">替换哪个 Part</label>
                <select v-model="replaceOriginalPart" :disabled="replaceUploading"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer disabled:opacity-50">
                  <option v-for="f in fileParts" :key="f.part || ''" :value="f.part || ''">{{ f.part || '完整' }}</option>
                </select>
              </div>

              <div v-if="fileParts.length > 1" class="flex items-center justify-between rounded-lg border border-amber-900 bg-amber-950 bg-opacity-30 px-4 py-3">
                <div>
                  <p class="text-sm text-gray-200">替换整部</p>
                  <p class="text-xs text-amber-300 mt-0.5">上传单文件后移除其它 part</p>
                </div>
                <button @click="replaceWhole = !replaceWhole" :disabled="replaceUploading"
                  :class="['relative flex-shrink-0 w-11 h-6 rounded-full transition-colors duration-200 cursor-pointer disabled:opacity-50',
                    replaceWhole ? 'bg-amber-600' : 'bg-gray-700']">
                  <span :class="['absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200',
                    replaceWhole ? 'translate-x-6' : 'translate-x-1']"></span>
                </button>
              </div>

              <!-- File picker -->
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1.5">视频文件</label>
                <button @click="$refs.replaceFileInput.click()" :disabled="replaceUploading"
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-800 border border-dashed border-gray-600 hover:border-indigo-500 transition-colors cursor-pointer disabled:opacity-50 group text-left">
                  <svg class="w-5 h-5 text-gray-500 group-hover:text-indigo-400 transition-colors flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                  </svg>
                  <span :class="['text-sm truncate', replaceFile ? 'text-gray-200' : 'text-gray-500']">
                    {{ replaceFile ? replaceFile.name : '点击选择视频文件…' }}
                  </span>
                </button>
                <input ref="replaceFileInput" type="file" class="hidden" @change="onReplaceFileChange" :disabled="replaceUploading" />
              </div>

              <!-- Attributes + Part (list rows) -->
              <div class="rounded-lg border border-gray-800 overflow-hidden divide-y divide-gray-800">
                <div class="px-4 py-2 bg-gray-800 bg-opacity-60">
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">属性标记</span>
                </div>
                <!-- 中文字幕 -->
                <div class="flex items-center justify-between px-4 py-3">
                  <span class="text-sm text-gray-300">中文字幕</span>
                  <button @click="replaceSubtitleZh = !replaceSubtitleZh" :disabled="replaceUploading"
                    :class="['relative flex-shrink-0 w-11 h-6 rounded-full transition-colors duration-200 cursor-pointer disabled:opacity-50',
                      replaceSubtitleZh ? 'bg-indigo-600' : 'bg-gray-700']">
                    <span :class="['absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200',
                      replaceSubtitleZh ? 'translate-x-6' : 'translate-x-1']"></span>
                  </button>
                </div>
                <!-- 无码破解分类 -->
                <div class="px-4 py-3">
                  <span class="text-sm text-gray-300">无码破解</span>
                  <div class="flex gap-2 mt-2">
                    <button v-for="tag in ['JAV 无码破解','LADA 无码破解','LTX 无码破解']" :key="tag"
                      @click="replaceUncensoredCrackTag = tag" :disabled="replaceUploading"
                      :class="['flex-1 px-2 py-1.5 rounded text-xs transition-colors disabled:opacity-50',
                        replaceUncensoredCrackTag === tag ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600']">
                      {{ tag.replace(' 无码破解', '') }}
                    </button>
                  </div>
                </div>
                <!-- 原装无码 -->
                <div class="flex items-center justify-between px-4 py-3">
                  <span class="text-sm text-gray-300">原装无码</span>
                  <button @click="replaceUncensoredNative = !replaceUncensoredNative" :disabled="replaceUploading"
                    :class="['relative flex-shrink-0 w-11 h-6 rounded-full transition-colors duration-200 cursor-pointer disabled:opacity-50',
                      replaceUncensoredNative ? 'bg-indigo-600' : 'bg-gray-700']">
                    <span :class="['absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200',
                      replaceUncensoredNative ? 'translate-x-6' : 'translate-x-1']"></span>
                  </button>
                </div>
                <!-- Part row: toggle + inline dropdown -->
                <div v-if="!replaceWhole" class="flex items-center justify-between px-4 py-3">
                  <span class="text-sm text-gray-300">Part</span>
                  <div class="flex items-center gap-2">
                    <template v-if="replacePartOn">
                      <template v-if="!replacePartOther">
                        <button v-for="n in [1,2,3]" :key="n"
                          @click="replacePartNum = n" :disabled="replaceUploading"
                          :class="['px-2.5 py-1 rounded text-sm transition-colors cursor-pointer disabled:opacity-50',
                            replacePartNum === n ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600']">{{ n }}</button>
                        <button @click="replacePartOther = true; replacePartNum = 4" :disabled="replaceUploading"
                          class="px-2.5 py-1 rounded text-sm bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors cursor-pointer disabled:opacity-50">other</button>
                      </template>
                      <select v-else v-model="replacePartNum" :disabled="replaceUploading"
                        class="bg-gray-800 border border-gray-700 rounded-md px-2 py-1 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer">
                        <option v-for="n in 30" :key="n" :value="n">Part {{ n }}</option>
                      </select>
                    </template>
                    <button @click="replacePartOn = !replacePartOn" :disabled="replaceUploading"
                      :class="['relative flex-shrink-0 w-11 h-6 rounded-full transition-colors duration-200 cursor-pointer disabled:opacity-50',
                        replacePartOn ? 'bg-indigo-600' : 'bg-gray-700']">
                      <span :class="['absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200',
                        replacePartOn ? 'translate-x-6' : 'translate-x-1']"></span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Filename preview -->
              <div v-if="replaceFile" class="bg-gray-800 rounded-lg px-3 py-3 space-y-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-16 flex-shrink-0">目标文件名</span>
                  <input v-model="replaceDestName" :disabled="replaceUploading"
                    class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 font-mono focus:outline-none focus:border-indigo-500 transition-colors min-w-0" />
                </div>
                <div class="flex items-start gap-2">
                  <span class="text-xs text-gray-500 w-16 flex-shrink-0 pt-0.5">最终文件名</span>
                  <span class="text-xs text-indigo-300 font-mono break-all leading-relaxed">{{ replaceFinalName }}</span>
                </div>
              </div>

              <!-- Progress -->
              <div v-if="replaceUploading" class="space-y-1.5">
                <div class="flex items-center gap-3">
                  <div class="flex-1 bg-gray-800 rounded-full h-2 overflow-hidden">
                    <div class="bg-indigo-500 h-2 rounded-full transition-all duration-300" :style="{ width: replaceProgress + '%' }"></div>
                  </div>
                  <span class="text-xs text-gray-300 font-mono w-9 text-right flex-shrink-0">{{ replaceProgress }}%</span>
                </div>
                <p class="text-xs text-gray-500 font-mono">{{ replaceSpeed }} · 已用 {{ replaceElapsed }} · 剩余 {{ replaceRemaining }}</p>
              </div>

              <!-- Error -->
              <div v-if="replaceError" class="flex items-start gap-2 bg-red-900 bg-opacity-30 border border-red-800 rounded-lg px-3 py-2.5">
                <svg class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <p class="text-sm text-red-300">{{ replaceError }}</p>
              </div>

            </div>

            <!-- Footer -->
            <div class="flex justify-end gap-2 px-5 py-3 border-t border-gray-800">
              <button @click="closeReplaceModal" :disabled="replaceUploading"
                class="px-4 py-2 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors cursor-pointer disabled:opacity-40">取消</button>
              <button @click="startReplaceUpload" :disabled="!replaceFile || replaceUploading"
                class="px-5 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
                {{ replaceUploading ? '上传中…' : '上传' }}
              </button>
            </div>

          </div>
        </div>
      </teleport>
    </div>
  </div>
</script>

  <!-- ========== ActorView ========== -->
  <script type="text/x-template" id="tpl-actor">
  <div>
    <div v-if="loading" class="text-center py-20 text-gray-500">加载中…</div>
    <div v-else-if="!data" class="text-center py-20 text-gray-500">未找到该演员</div>
    <div v-else>
      <button @click="$router.back()" class="text-indigo-400 hover:text-indigo-300 text-sm mb-4">← 返回</button>
      <div class="flex items-center gap-4 mb-6">
        <!-- Avatar + upload overlay -->
        <div class="relative flex-shrink-0 group cursor-pointer" @click="triggerUpload">

          <th style="min-width:155px"><div class="ltx-filter-range"><input v-model.number="columnFilters.attemptsMin" type="number" min="0" placeholder="最少" aria-label="列筛选：最少执行次数" /><input v-model.number="columnFilters.attemptsMax" type="number" min="0" placeholder="最多" aria-label="列筛选：最多执行次数" /></div></th>

            </td>
            <td class="px-3 py-3 text-gray-300" style="min-width:120px;max-width:180px">{{ row.actresses || '—' }}</td>
            <td class="px-3 py-3 text-gray-400" style="min-width:180px;max-width:300px">{{ row.title || '—' }}</td>
